name: auto
on:
  push:
    paths:
      - 'hI-OSINT/hi.db'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: cd hI-OSINT && python decoder.py
    - run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add hI-OSINT/data.txt
        git commit -m "auto dec" || exit 0
        git push