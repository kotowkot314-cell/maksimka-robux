<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCKET — разбор переписки</title>
<link rel="stylesheet" href="style.css">
<script src="chat-analyzer-clean.js" defer></script>
</head>
<body>
<main class="wrap">
  <h1>ROCKET</h1>
  <p class="sub">Вставь сообщение — разберём и предложим ответ</p>

  <div class="personas">
    <button class="persona active" data-persona="female">Девушка</button>
    <button class="persona" data-persona="male">Парень</button>
    <button class="persona" data-persona="femboy">Фембой</button>
  </div>

  <textarea id="input" placeholder="Сообщение собеседника..."></textarea>

  <div class="row">
    <button id="analyze" class="primary">Разобрать</button>
    <button id="clear" class="ghost">Очистить</button>
  </div>

  <section id="result" class="result hidden">
    <div class="card">
      <div class="line"><span class="label">Смысл</span><span id="meaning"></span></div>
      <div class="line"><span class="label">Тон</span><span id="tone"></span></div>
      <div class="line"><span class="label">Намерение</span><span id="intent"></span></div>
    </div>
    <div id="replies" class="replies"></div>
  </section>
</main>
</body>
</html>
