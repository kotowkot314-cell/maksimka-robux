<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>HIxRINUX — Live Demo</title>
  <style>
    body { background:#0b0f14; color:#d7e2ea; font-family:monospace; margin:0; }
    #screen { width:100%; height:80vh; border:1px solid #2a3947; }
    .bar { padding:10px; background:#111a22; }
  </style>
</head>
<body>
  <div class="bar">HIxRINUX Web Simulator — загрузка образа…</div>
  <div id="screen"></div>

  <script src="https://copy.sh/v86/build/libv86.js"></script>
  <script>
    const emulator = new V86({
      wasm_path: "https://copy.sh/v86/build/v86.wasm",
      memory_size: 128 * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      screen_container: document.getElementById("screen"),
      bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
      vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
      cdrom: { url: "hixrinux.iso" },     // ваш образ
      autostart: true,
    });
  </script>
</body>
</html>
