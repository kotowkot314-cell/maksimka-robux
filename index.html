<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIxRINUX - Real Search</title>
    <style>
        body {
            background-color: #001f3f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-top: 40px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            margin-bottom: 30px;
            font-size: 1rem;
            opacity: 0.7;
        }

        .container {
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .search-block {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-block h2 {
            margin: 0;
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .search-block h2 span {
            font-size: 0.8rem;
            font-weight: normal;
            background: #00a8ff;
            color: #001f3f;
            padding: 2px 8px;
            border-radius: 4px;
        }

        input[type="file"] {
            color: white;
            padding: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #00a8ff;
        }

        button {
            background-color: #ffffff;
            color: #001f3f;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background-color: #00a8ff;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #result-area {
            width: 90%;
            max-width: 900px;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .result-card {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .result-card img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-bottom: 10px;
            border: 2px solid white;
        }

        .result-card a {
            color: #00a8ff;
            text-decoration: none;
            font-weight: bold;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .status {
            font-size: 1.2rem;
            color: #00a8ff;
            text-align: center;
            padding: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .error {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }
    </style>
</head>
<body>

    <h1>HIxRINUX</h1>
    <p class="subtitle">Реальный поиск по фото (Google Lens) и коду (GitHub)</p>

    <div class="container">
        <div class="search-block">
            <h2>Поиск по фото <span>Google Lens API</span></h2>
            <input type="file" id="imageInput" accept="image/*">
            <button id="btnPhoto" onclick="searchByPhoto()">Найти в интернете</button>
        </div>

        <div class="search-block">
            <h2>Поиск по коду <span>GitHub Code Search</span></h2>
            <textarea id="codeInput" placeholder="Вставьте код (JS, Python, HTML и т.д.). Бот выделит уникальные строки и найдет их на GitHub..."></textarea>
            <button id="btnCode" onclick="searchByCode()">Найти на GitHub</button>
        </div>
    </div>

    <div id="result-area"></div>

    <script>
        const resultArea = document.getElementById('result-area');

        async function searchByPhoto() {
            const fileInput = document.getElementById('imageInput');
            const btn = document.getElementById('btnPhoto');
            
            if (fileInput.files.length === 0) {
                showError("Выберите изображение.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            btn.disabled = true;
            resultArea.innerHTML = '<div class="status">Отправка изображения в Google Lens...</div>';

            reader.onload = async (e) => {
                const base64Image = e.target.result.split(',')[1];
                
                try {
                    const response = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent("https://lens.google.com/v3/upload?stcs=" + Date.now()), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `encoded_image=${encodeURIComponent(base64Image)}`
                    });

                    const text = await response.text();
                    const matches = [...text.matchAll(/https?:\/\/[^"'\s]+\.(?:jpg|jpeg|png|webp)/g)];
                    const uniqueUrls = [...new Set(matches.map(m => m[0]))].slice(0, 10);

                    if (uniqueUrls.length === 0) {
                        resultArea.innerHTML = '<div class="result-card error">Совпадений не найдено. Попробуйте другое фото.</div>';
                    } else {
                        resultArea.innerHTML = `<div class="status">Найдено ${uniqueUrls.length} результатов:</div>`;
                        uniqueUrls.forEach((url, index) => {
                            resultArea.innerHTML += `
                                <div class="result-card">
                                    <div style="font-size:0.8rem; opacity:0.6; margin-bottom:5px;">Результат #${index + 1}</div>
                                    <img src="${url}" onerror="this.style.display='none'">
                                    <br>
                                    <a href="${url}" target="_blank">${url}</a>
                                </div>
                            `;
                        });
                    }
                } catch (error) {
                    resultArea.innerHTML = '<div class="result-card error">Ошибка Google Lens (CORS/API). Попробуйте другой браузер.</div>';
                } finally {
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }

        async function searchByCode() {
            const code = document.getElementById('codeInput').value;
            const btn = document.getElementById('btnCode');

            if (code.trim().length < 10) {
                showError("Код слишком короткий.");
                return;
            }

            const lines = code.split('\n')
                .map(l => l.trim())
                .filter(l => l.length > 15 && !l.startsWith('//') && !l.startsWith('#') && !l.startsWith('import'))
                .slice(0, 5);

            if (lines.length === 0) {
                showError("Не найдено достаточно уникального кода.");
                return;
            }

            const searchQuery = lines.join(' ');
            
            btn.disabled = true;
            resultArea.innerHTML = '<div class="status">Поиск уникальных строк на GitHub...</div>';

            try {
                const response = await fetch(`https://api.github.com/search/code?q=${encodeURIComponent(searchQuery)}`, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'User-Agent': 'HIxRINUX-App'
                    }
                });

                if (!response.ok) {
                    throw new Error(`GitHub API: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                if (data.total_count === 0) {
                    resultArea.innerHTML = '<div class="result-card">Ничего не найдено. Возможно, код уникален.</div>';
                } else {
                    resultArea.innerHTML = `<div class="status">Найдено ${data.total_count} репозиториев:</div>`;
                    data.items.forEach(item => {
                        resultArea.innerHTML += `
                            <div class="result-card">
                                <a href="${item.html_url}" target="_blank" style="font-size:1.1rem;">${item.repository.full_name}</a>
                                <div style="font-size:0.8rem; opacity:0.7; margin-top:5px;">Файл: ${item.name}</div>
                                <div style="font-size:0.8rem; opacity:0.7;">Автор: ${item.repository.owner.login}</div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                resultArea.innerHTML = `<div class="result-card error">Ошибка GitHub API: ${error.message} (Лимит запросов: 10/мин)</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function showError(msg) {
            resultArea.innerHTML = `<div class="result-card error">${msg}</div>`;
        }
    </script>

</body>
</html>
