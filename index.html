<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxxiVerse</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

#splash {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: #ffffff; z-index: 9999;
display: flex; justify-content: center; align-items: center;
transition: opacity 0.6s ease;
}
#splash h1 {
color: #000000; font-size: 3rem; letter-spacing: 6px; font-weight: bold;
animation: fadeIn 1.5s ease;
}
#splash.hidden { opacity: 0; pointer-events: none; }
@keyframes fadeIn {
0% { opacity: 0; transform: scale(0.9); }
100% { opacity: 1; transform: scale(1); }
}

#main-content { display: none; flex-direction: column; height: 100vh; }

header {
background: #111; border-bottom: 1px solid #333;
padding: 10px 15px; display: flex; justify-content: space-between; align-items: center;
z-index: 10;
}
.logo { font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; }
.nav-links { display: flex; gap: 15px; margin-left: 15px; }
.nav-links span { cursor: pointer; font-size: 0.9rem; color: #fff; }

.user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
.login-btn { color: #fff; cursor: pointer; border: 1px solid #555; padding: 5px 15px; border-radius: 5px; background: transparent; }
.login-btn:hover { background: #333; }

.main-container {
display: flex; flex-direction: row; flex: 1; overflow-x: auto; overflow-y: hidden;
padding: 10px; gap: 10px;
}
.column {
background: #111; border: 1px solid #222; border-radius: 8px;
padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
flex-shrink: 0;
}
.col-1 { width: 28%; min-width: 130px; }
.col-2 { width: 44%; min-width: 200px; }
.col-3 { width: 28%; min-width: 130px; }

.profile-name { text-align: center; font-weight: bold; margin-top: 5px; font-size: 0.9rem; }
.section-title { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 10px; }

#chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
.chat-msg { font-size: 0.8rem; line-height: 1.4; }
.chat-msg b { color: #fff; }
.chat-input-area { display: flex; gap: 5px; margin-top: auto; }
.chat-input-area input { flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: #fff; outline: none; font-size: 0.8rem; }
.chat-input-area button { padding: 8px 12px; border: none; border-radius: 5px; background: #fff; color: #000; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

.game-btn {
background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
padding: 15px 10px; text-align: center; cursor: pointer; margin-bottom: 5px;
}
.game-btn:hover { background: #333; }

.not-logged {
display: flex; flex-direction: column; justify-content: center; align-items: center;
height: 100%; color: #666; font-size: 1.1rem; text-align: center; padding: 20px;
}

.modal-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
}
.modal-box { background: #111; border: 1px solid #333; border-radius: 10px; padding: 25px; width: 90%; max-width: 350px; }
.modal-box h3 { text-align: center; margin-bottom: 20px; font-weight: 300; }
.input-group { margin-bottom: 15px; }
.input-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #888; }
.input-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: #fff; outline: none; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #fff; color: #000; font-weight: bold; cursor: pointer; margin-top: 5px; }
.btn-link { display: block; text-align: center; margin-top: 15px; color: #888; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
.error-text { color: #ff5555; font-size: 0.85rem; text-align: center; margin-bottom: 10px; display: none; }
</style>
</head>
<body>

<div id="splash">
<h1>MaxxiVerse</h1>
</div>

<div id="main-content">

<header>
<div style="display: flex; align-items: center;">
<div class="logo">MaxxiVerse</div>
<div class="nav-links">
<span>Главная</span>
</div>
</div>
<div id="header-user" class="user-info">
<button class="login-btn" onclick="openLogin()">Login</button>
</div>
</header>

<div class="main-container">

<div class="column col-1">
<div id="main-nick" class="profile-name">Гость</div>
<div class="section-title">Друзья</div>
<div style="color:#555; font-size:0.75rem; text-align:center;">Нет друзей</div>
</div>

<div class="column col-2" id="col-chat">
<div id="chat-content" style="display: none; flex-direction: column; height: 100%;">
<div class="section-title">Чат</div>
<div id="chat-box">
<div class="chat-msg"><b>Система:</b> Добро пожаловать в чат!</div>
</div>
<div class="chat-input-area">
<input type="text" id="chat-input" placeholder="Написать сообщение...">
<button onclick="sendMessage()">➤</button>
</div>
</div>
<div class="not-logged" id="chat-not-logged">
<div>Вы еще не вошли в игру</div>
<div style="font-size:0.8rem; margin-top:10px;">Войдите, чтобы общаться</div>
</div>
</div>

<div class="column col-3" id="col-games">
<div id="games-content" style="display: none;">
<div class="section-title">Игры</div>
<div class="game-btn" onclick="window.location.href='game.html'">
<div style="font-size: 1.1rem; margin-bottom: 5px;">Pixel Jump</div>
<div style="font-size: 0.7rem; color: #888;">Ходи и прыгай</div>
</div>
</div>
<div class="not-logged" id="games-not-logged">
<div>Вы еще не вошли в игру</div>
<div style="font-size:0.8rem; margin-top:10px;">Войдите, чтобы играть</div>
</div>
</div>

</div>
</div>

<div id="login-modal" class="modal-overlay">
<div class="modal-box">
<h3 id="login-title">ВХОД</h3>
<div id="login-error" class="error-text"></div>

<div id="login-fields">
<div class="input-group"><label>Никнейм</label><input type="text" id="login-nick" placeholder="Введите ник"></div>
<div class="input-group"><label>Пароль</label><input type="password" id="login-pass" placeholder="Введите пароль"></div>
<button class="btn" onclick="doLogin()">Войти</button>
<div class="btn-link" onclick="showRegister()">Создать аккаунт</div>
</div>

<div id="register-fields" style="display: none;">
<div class="input-group"><label>Никнейм</label><input type="text" id="reg-nick" placeholder="Введите ник"></div>
<div class="input-group"><label>Пароль</label><input type="password" id="reg-pass" placeholder="Придумайте пароль"></div>
<button class="btn" onclick="doRegister()">Зарегистрироваться</button>
<div class="btn-link" onclick="showLogin()">Назад ко входу</div>
</div>
</div>
</div>

<script>
function getUsers() {
try {
var raw = localStorage.getItem('maxxi_users');
if (!raw) return {};
return JSON.parse(raw) || {};
} catch (e) {
return {};
}
}

function saveUsers(users) {
localStorage.setItem('maxxi_users', JSON.stringify(users));
}

window.addEventListener('load', function() {
setTimeout(function() {
document.getElementById('splash').classList.add('hidden');
document.getElementById('main-content').style.display = 'flex';
var savedNick = localStorage.getItem('maxxi_nick');
if (savedNick) {
var users = getUsers();
if (users[savedNick]) {
applyLogin(savedNick);
}
}
}, 2000);
});

function applyLogin(nick) {
document.getElementById('main-nick').innerText = nick;
document.getElementById('chat-not-logged').style.display = 'none';
document.getElementById('chat-content').style.display = 'flex';
document.getElementById('games-not-logged').style.display = 'none';
document.getElementById('games-content').style.display = 'block';
localStorage.setItem('maxxi_nick', nick);
document.getElementById('header-user').innerHTML = '<span>' + nick + '</span>';
}

function openLogin() {
document.getElementById('login-modal').style.display = 'flex';
document.getElementById('login-error').style.display = 'none';
showLogin();
}

function showLogin() {
document.getElementById('login-title').innerText = 'ВХОД';
document.getElementById('login-fields').style.display = 'block';
document.getElementById('register-fields').style.display = 'none';
document.getElementById('login-error').style.display = 'none';
}

function showRegister() {
document.getElementById('login-title').innerText = 'РЕГИСТРАЦИЯ';
document.getElementById('login-fields').style.display = 'none';
document.getElementById('register-fields').style.display = 'block';
document.getElementById('login-error').style.display = 'none';
}

function doRegister() {
var nick = document.getElementById('reg-nick').value.trim();
var pass = document.getElementById('reg-pass').value.trim();
var errorEl = document.getElementById('login-error');

if (!nick || !pass) {
errorEl.innerText = 'Заполните все поля!';
errorEl.style.display = 'block';
return;
}

var users = getUsers();
if (users[nick]) {
errorEl.innerText = 'Такой ник уже занят!';
errorEl.style.display = 'block';
return;
}

users[nick] = { pass: pass };
saveUsers(users);
errorEl.style.display = 'none';
document.getElementById('login-modal').style.display = 'none';
applyLogin(nick);
alert('Аккаунт создан! Добро пожаловать, ' + nick);
}

function doLogin() {
var nick = document.getElementById('login-nick').value.trim();
var pass = document.getElementById('login-pass').value.trim();
var errorEl = document.getElementById('login-error');

if (!nick || !pass) {
errorEl.innerText = 'Заполните поля!';
errorEl.style.display = 'block';
return;
}

var users = getUsers();
if (!users[nick]) {
errorEl.innerText = 'Аккаунт не найден';
errorEl.style.display = 'block';
return;
}

if (users[nick].pass !== pass) {
errorEl.innerText = 'Неверный пароль';
errorEl.style.display = 'block';
return;
}

errorEl.style.display = 'none';
document.getElementById('login-modal').style.display = 'none';
applyLogin(nick);
}

function sendMessage() {
var input = document.getElementById('chat-input');
var text = input.value.trim();
if (!text) return;
var box = document.getElementById('chat-box');
var div = document.createElement('div');
div.className = 'chat-msg';
div.innerHTML = '<b>' + document.getElementById('main-nick').innerText + ':</b> ' + text;
box.appendChild(div);
input.value = '';
box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
