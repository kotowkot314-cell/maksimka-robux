<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MyOS Web Simulator</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/editor/editor.main.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1e1e1e; color: #d4d4d4; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* ЭКРАН РЕДАКТОРА */
        #ideView { display: flex; flex-direction: column; height: 100%; width: 100%; }
        .toolbar { background: #252526; padding: 10px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
        .btn-start { background: #28a745; color: white; border: none; padding: 8px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-left: auto; }
        .btn-start:hover { background: #218838; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .editor-container { width: 100%; height: 100%; }

        /* ЭКРАН СИСТЕМЫ */
        #systemView { display: none; flex-direction: column; height: 100%; width: 100%; background: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; box-sizing: border-box; padding: 20px; }
        .sys-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .sys-title { color: #fff; font-size: 20px; font-weight: bold; }
        .sys-console { flex: 1; overflow-y: auto; white-space: pre-wrap; font-size: 16px; line-height: 1.5; }
        .sys-controls { display: flex; gap: 15px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #333; }
        .sys-btn { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; cursor: pointer; font-family: monospace; font-size: 16px; font-weight: bold; }
        .sys-btn:hover { background: #0f0; color: #000; }
        .sys-btn.danger { color: #f00; border-color: #f00; }
        .sys-btn.danger:hover { background: #f00; color: #000; }
    </style>
</head>
<body>

    <!-- РЕДАКТОР -->
    <div id="ideView">
        <div class="toolbar">
            <span style="font-weight:bold; color:#ccc;">main.c</span>
            <button class="btn-start" onclick="runSimulation()">▶ СТАРТ (Запуск)</button>
        </div>
        <div class="workspace">
            <div class="editor-container" id="editor"></div>
        </div>
    </div>

    <!-- СИСТЕМА -->
    <div id="systemView">
        <div class="sys-header">
            <div class="sys-title">MyOS Virtual Terminal</div>
            <div id="sysStatus">Статус: Загрузка...</div>
        </div>
        <div class="sys-console" id="sysConsole"></div>
        
        <div class="sys-controls">
            <button class="sys-btn" onclick="rebootSystem()">🔄 Перезагрузить</button>
            <button class="sys-btn danger" onclick="powerOffSystem()">⏻ Выключить</button>
            <button class="sys-btn" onclick="returnToEditor()">← В редактор</button>
        </div>
    </div>

    <script>
        let editor;
        
        // Инициализация редактора
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '#include <stdio.h>\n\nint main() {\n    printf("Hello from MyOS!\\n");\n    printf("System initialized successfully.\\n");\n    return 0;\n}',
                language: 'c',
                theme: 'vs-dark',
                fontSize: 16,
                minimap: { enabled: false },
                automaticLayout: true
            });
        });

        // Запуск симуляции
        function runSimulation() {
            // Скрываем редактор, показываем терминал
            document.getElementById('ideView').style.display = 'none';
            document.getElementById('systemView').style.display = 'flex';
            
            const consoleDiv = document.getElementById('sysConsole');
            const statusDiv = document.getElementById('sysStatus');
            
            statusDiv.innerText = "Статус: Загрузка...";
            statusDiv.style.color = "#ff0";
            consoleDiv.innerHTML = "";

            // Имитация процесса загрузки с задержками
            const steps = [
                { text: "BIOS v1.0 - Initializing hardware...", delay: 500 },
                { text: "Memory check: 640KB Base, 128MB Extended... OK", delay: 800 },
                { text: "Loading bootloader from sector 0...", delay: 1200 },
                { text: "Entering Protected Mode...", delay: 1500 },
                { text: "Loading kernel.elf into 0x100000...", delay: 2000 },
                { text: "Kernel initialized successfully.", delay: 2500, color: "#fff" },
                { text: "\n=== MyOS v0.1 ===", delay: 2800, color: "#fff" },
                { text: "Type 'help' to see available commands.\n", delay: 3000 },
                { text: "root@myos:~# ", delay: 3200, isPrompt: true }
            ];

            steps.forEach(step => {
                setTimeout(() => {
                    if (step.isPrompt) {
                        statusDiv.innerText = "Статус: Работает";
                        statusDiv.style.color = "#0f0";
                        makePrompt(consoleDiv);
                    } else {
                        const span = document.createElement('div');
                        span.innerText = step.text;
                        if (step.color) span.style.color = step.color;
                        consoleDiv.appendChild(span);
                        consoleDiv.scrollTop = consoleDiv.scrollHeight;
                    }
                }, step.delay);
            });
        }

        // Создание строки ввода
        function makePrompt(consoleDiv) {
            const wrapper = document.createElement('div');
            wrapper.style.display = 'flex';
            wrapper.innerHTML = `<span>root@myos:~#&nbsp;</span>`;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.style.background = 'transparent';
            input.style.border = 'none';
            input.style.color = '#0f0';
            input.style.fontFamily = 'monospace';
            input.style.fontSize = '16px';
            input.style.outline = 'none';
            input.style.flex = '1';
            input.autofocus = true;

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const cmd = input.value.trim();
                    input.disabled = true;
                    wrapper.innerHTML += `<span>${cmd}</span>`;
                    
                    // Обработка команд
                    const response = processCommand(cmd);
                    if (response) {
                        const resSpan = document.createElement('div');
                        resSpan.innerHTML = response;
                        consoleDiv.appendChild(resSpan);
                    }
                    
                    makePrompt(consoleDiv);
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
            });

            wrapper.appendChild(input);
            consoleDiv.appendChild(wrapper);
            input.focus();
        }

        // Обработчик команд
        function processCommand(cmd) {
            cmd = cmd.toLowerCase();
            if (cmd === 'help') {
                return "Доступные команды:<br>&nbsp;&nbsp;help&nbsp;&nbsp;- Показать это сообщение<br>&nbsp;&nbsp;mem&nbsp;&nbsp;&nbsp;- Карта памяти<br>&nbsp;&nbsp;clear&nbsp;- Очистить экран<br>&nbsp;&nbsp;reboot- Перезагрузка";
            }
            if (cmd === 'mem') {
                return "0x00000000 - 0x0009FFFF : RAM<br>0x000A0000 - 0x000BFFFF : Video RAM<br>0x00100000 - 0x08000000 : Kernel";
            }
            if (cmd === 'clear') {
                document.getElementById('sysConsole').innerHTML = "";
                return "";
            }
            if (cmd === 'reboot') {
                rebootSystem();
                return "";
            }
            return `<span style="color:#f00">Команда не найдена: ${cmd}</span>`;
        }

        // Перезагрузка
        function rebootSystem() {
            runSimulation();
        }

        // Выключение
        function powerOffSystem() {
            document.getElementById('sysConsole').innerHTML = "<span style='color:#f00'>Система остановлена. Питание отключено.</span>";
            document.getElementById('sysStatus').innerText = "Статус: Выключено";
            document.getElementById('sysStatus').style.color = "#f00";
        }

        // Возврат в редактор
        function returnToEditor() {
            document.getElementById('systemView').style.display = 'none';
            document.getElementById('ideView').style.display = 'flex';
            document.getElementById('sysConsole').innerHTML = '';
        }
    </script>
</body>
</html>
