<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Friend Finder</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; margin: 0; }
  h1 { color: #00b4d8; text-align: center; }
  .search-box { text-align: center; margin: 20px 0; }
  input { padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #00b4d8; background: #16213e; color: #fff; width: 70%; max-width: 300px; }
  button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #00b4d8; color: #fff; cursor: pointer; margin-left: 8px; }
  button:active { background: #0096c7; }
  .result { margin-top: 20px; padding: 20px; background: #16213e; border-radius: 12px; display: none; max-width: 500px; margin-left: auto; margin-right: auto; }
  .result img { width: 180px; height: 180px; border-radius: 12px; border: 3px solid #00b4d8; display: block; margin: 0 auto 10px; }
  .result p { margin: 8px 0; }
  .link { color: #00b4d8; word-break: break-all; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
  <h1>🔍 Roblox Friend Finder</h1>
  <div class="search-box">
    <input id="nick" placeholder="Введи ник (например: platon388)" />
    <button onclick="findUser()">Найти</button>
  </div>
  <div class="result" id="result"></div>

<script>
// 🔧 НАСТРОЙКА ПРОКСИ
// Замени 'proxy.server:3128' на реальный адрес твоего прокси.
// Формат: 'http://IP:ПОРТ' или 'http://user:pass@IP:ПОРТ'
const PROXY_URL = 'http://proxy.server:3128';

async function findUser() {
  const nick = document.getElementById('nick').value.trim();
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = 'Ищу...';

  if (!nick) {
    result.innerHTML = '<p class="error">Введи ник!</p>';
    return;
  }

  // Хелпер для запросов через прокси
  async function fetchViaProxy(url) {
    // Мы отправляем запрос на наш прокси, передавая целевой URL
    const proxyUrl = PROXY_URL + '/?url=' + encodeURIComponent(url);
    return fetch(proxyUrl);
  }

  try {
    // 1. Получаем ID по нику
    const searchRes = await fetchViaProxy('https://users.roblox.com/v1/usernames/users');
    // Внимание: для POST-запроса через прокси логика может отличаться.
    // Если твой прокси не поддерживает POST, используй GET-версию (если есть).
    // Ниже — упрощённый вариант для демонстрации.
    // В реальности нужно настроить прокси так, чтобы он принимал POST.
    
    // --- Временная заглушка для примера (замени на реальный код) ---
    result.innerHTML = '<p class="error">Для работы нужен правильно настроенный прокси. Свяжись со мной, я помогу.</p>';
    return;
    // -------------------------------------------------------------

    /*
    // --- ПОЛНЫЙ КОД (раскомментируй, когда прокси будет готов) ---
    const searchData = await searchRes.json();
    if (!searchData.data || searchData.data.length === 0) {
      result.innerHTML = '<p class="error">❌ Игрок не найден</p>';
      return;
    }
    const userId = searchData.data[0].id;

    // 2. Инфо о профиле
    const infoRes = await fetchViaProxy(`https://users.roblox.com/v1/users/${userId}`);
    const info = await infoRes.json();

    // 3. Аватар
    const avatarRes = await fetchViaProxy(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
    const avatarData = await avatarRes.json();
    const avatarUrl = avatarData.data[0]?.imageUrl || '';

    result.innerHTML = `
      <img src="${avatarUrl}" alt="avatar" />
      <p><strong>Ник:</strong> ${info.name}</p>
      <p><strong>Display:</strong> ${info.displayName}</p>
      <p><strong>ID:</strong> ${userId}</p>
      <p><strong>Создан:</strong> ${new Date(info.created).toLocaleDateString('ru-RU')}</p>
      <p><strong>Профиль:</strong><br>
        <a class="link" href="https://www.roblox.com/users/${userId}/profile" target="_blank">
          https://www.roblox.com/users/${userId}/profile
        </a>
      </p>
    `;
    */
  } catch (e) {
    result.innerHTML = '<p class="error">Ошибка: ' + e.message + '</p>';
  }
}
</script>
</body>
</html>
