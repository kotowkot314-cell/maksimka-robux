<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIxRINUX — Web Test Stand</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>HIxRINUX <span>Web Test Stand</span></h1>
    <div class="controls">
      <button id="btnStart">▶ Запустить</button>
      <button id="btnStop" disabled>■ Остановить</button>
      <button id="btnReset" disabled>⟳ Перезагрузка</button>
      <label class="file">
        Загрузить ISO
        <input type="file" id="isoInput" accept=".iso,.img,.bin">
      </label>
    </div>
  </header>

  <main>
    <div id="screen" class="screen">
      <div class="placeholder">
        <p>Эмулятор не запущен.</p>
        <p>Нажмите «Запустить», чтобы загрузить образ <code>images/hixrinux.iso</code>,</p>
        <p>или выберите свой ISO через «Загрузить ISO».</p>
      </div>
    </div>

    <aside class="sidebar">
      <h2>Лог</h2>
      <pre id="log"></pre>
    </aside>
  </main>

  <script src="https://copy.sh/v86/build/libv86.js"></script>
  <script src="app.js"></script>
</body>
</html>
