<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Jump 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #exit-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); border: 1px solid #555; color: #fff;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; z-index: 50;
        }
        #exit-btn:active { background: #333; }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
        }
        #joystick-knob {
            width: 55px; height: 55px; background: rgba(255,255,255,0.6);
            border-radius: 50%; position: absolute;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: bold; color: #fff; z-index: 50;
            cursor: pointer;
        }
        #jump-btn:active { background: rgba(255,255,255,0.4); }

        #nick-label {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="nick-label">Игрок</div>
    <button id="exit-btn" onclick="exitGame()">Выход</button>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" ontouchstart="doJump()" onmousedown="doJump()">▲</div>

    <div id="game-canvas"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
    <script>
        const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
        document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

        let scene, camera, renderer, player, clock;
        let velocityY = 0;
        let canJump = true;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        
        let camYaw = 0;
        let camPitch = 0;
        
        let cameraTouchId = null;
        let cameraTouchStart = { x: 0, y: 0 };

        const GRAVITY = -30;
        const JUMP_FORCE = 9;
        const MAX_WALK_SPEED = 8;
        const ACCELERATION = 40;
        const AIR_CONTROL = 5;
        const FRICTION = 15;
        const DEADZONE = 0.15;

        let currentSpeedX = 0;
        let currentSpeedZ = 0;

        let armL, armR, legL, legR;
        let walkCycle = 0;

        // Массив препятствий (для коллизий)
        const WALLS = [];
        // Массив платформ (тоже препятствия, но они могут быть сверху)
        const PLATFORMS = [];

        // --- РАЗМЕРЫ ПЕРСОНАЖА (СТАНДАРТНЫЙ R6) ---
        const TORSO_W = 0.8;
        const TORSO_H = 0.7;
        const TORSO_D = 0.4;
        
        const ARM_W = 0.3;
        const ARM_H = 0.7;
        
        const LEG_W = 0.3;
        const LEG_H = 0.7;
        const LEG_D = 0.4;
        
        const HEAD_W = 0.5;
        const HEAD_H = 0.5;
        const HEAD_D = 0.5;
        const HEAD_ROUND = 0.12;

        init3D();
        animate();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 20, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // --- БОЛЬШОЙ ПОЛ ---
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // --- МАТЕРИАЛЫ ---
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const platMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            const jumpPadMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
            const finishMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

            // --- ОББИ (полоса препятствий) ---
            // Функция для создания платформы (прыжковой)
            function createPlatform(x, y, z, w, h, d, mat) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, mat || platMat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                PLATFORMS.push({ x: x, y: y, z: z, w: w, h: h, d: d });
            }

            // Функция для создания стены (высокой)
            function createWall(x, y, z, w, h, d) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, wallMat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                WALLS.push({ x: x, y: y, z: z, w: w, h: h, d: d });
            }

            // 1. Стартовая площадка
            createPlatform(0, 0.25, 0, 5, 0.5, 5);

            // 2. Прыжки по маленьким платформам (классическое обби)
            // Прыжок 1
            createPlatform(3, 0.5, 1, 1.2, 0.3, 1.2);
            // Прыжок 2
            createPlatform(5, 0.9, 2.5, 1.2, 0.3, 1.2);
            // Прыжок 3
            createPlatform(7, 1.4, 1, 1.2, 0.3, 1.2);
            // Прыжок 4
            createPlatform(9, 1.9, -1, 1.2, 0.3, 1.2);
            // Прыжок 5
            createPlatform(11, 2.4, -3, 1.2, 0.3, 1.2);

            // 3. Узкий мост
            createPlatform(13, 2.7, -5, 4, 0.3, 0.6);

            // 4. Прыжок с моста на платформу
            createPlatform(15, 2.7, -8, 1.5, 0.3, 1.5);

            // 5. Лестница вверх
            createPlatform(16, 3.2, -10, 1.2, 0.3, 1.2);
            createPlatform(16, 3.7, -12, 1.2, 0.3, 1.2);
            createPlatform(16, 4.2, -14, 1.2, 0.3, 1.2);

            // 6. Финальная площадка
            createPlatform(16, 4.7, -16, 3, 0.3, 3, finishMat);

            // 7. Препятствия-стены, чтобы нельзя было пройти напрямую
            createWall(-5, 1.5, -8, 1, 3, 6);
            createWall(5, 1.5, -8, 1, 3, 6);
            createWall(-5, 1.5, 8, 1, 3, 6);
            createWall(5, 1.5, 8, 1, 3, 6);

            // 8. Прыжковая платформа (оранжевая, чтобы выделить)
            createPlatform(-8, 1, 5, 2, 0.3, 2, jumpPadMat);
            createPlatform(-12, 2, 5, 2, 0.3, 2, jumpPadMat);

            // --- ПЕРСОНАЖ R6 ---
            player = new THREE.Group();
            
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffe000 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0f5cff });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x00aa00 });

            // ЛИЦО
            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 256;
            faceCanvas.height = 256;
            const fctx = faceCanvas.getContext('2d');
            fctx.fillStyle = '#ffe000';
            fctx.fillRect(0, 0, 256, 256);

            fctx.fillStyle = '#000000';
            fctx.beginPath();
            fctx.ellipse(85, 110, 14, 20, 0, 0, Math.PI * 2);
            fctx.fill();
            fctx.beginPath();
            fctx.ellipse(171, 110, 14, 20, 0, 0, Math.PI * 2);
            fctx.fill();

            fctx.strokeStyle = '#000000';
            fctx.lineWidth = 4;
            fctx.lineCap = 'round';
            fctx.beginPath();
            fctx.arc(128, 160, 35, 0.2 * Math.PI, 0.8 * Math.PI);
            fctx.stroke();

            const faceTexture = new THREE.CanvasTexture(faceCanvas);
            const faceMaterial = new THREE.MeshStandardMaterial({ map: faceTexture });
            const plainYellow = new THREE.MeshStandardMaterial({ color: 0xffe000 });

            const headMats = [
                plainYellow,
                plainYellow,
                plainYellow,
                plainYellow,
                faceMaterial,
                plainYellow
            ];

            // ГОЛОВА
            const headGeo = new THREE.RoundedBoxGeometry(HEAD_W, HEAD_H, HEAD_D, 6, HEAD_ROUND);
            const head = new THREE.Mesh(headGeo, headMats);
            head.position.y = LEG_H + TORSO_H + HEAD_H / 2 + 0.02;
            head.castShadow = true;
            player.add(head);

            // ТУЛОВИЩЕ
            const torso = new THREE.Mesh(new THREE.BoxGeometry(TORSO_W, TORSO_H, TORSO_D), blueMat);
            torso.position.y = LEG_H + TORSO_H / 2;
            torso.castShadow = true;
            player.add(torso);

            // ЛЕВАЯ РУКА
            armL = new THREE.Mesh(new THREE.BoxGeometry(ARM_W, ARM_H, ARM_W), yellowMat);
            armL.geometry.translate(0, -ARM_H/2, 0);
            armL.position.set(-TORSO_W/2 - ARM_W/2, LEG_H + TORSO_H, 0);
            armL.castShadow = true;
            player.add(armL);

            // ПРАВАЯ РУКА
            armR = new THREE.Mesh(new THREE.BoxGeometry(ARM_W, ARM_H, ARM_W), yellowMat);
            armR.geometry.translate(0, -ARM_H/2, 0);
            armR.position.set(TORSO_W/2 + ARM_W/2, LEG_H + TORSO_H, 0);
            armR.castShadow = true;
            player.add(armR);

            // ЛЕВАЯ НОГА
            legL = new THREE.Mesh(new THREE.BoxGeometry(LEG_W, LEG_H, LEG_D), greenMat);
            legL.geometry.translate(0, -LEG_H/2, 0);
            legL.position.set(-LEG_W/2, LEG_H, 0);
            legL.castShadow = true;
            player.add(legL);

            // ПРАВАЯ НОГА
            legR = new THREE.Mesh(new THREE.BoxGeometry(LEG_W, LEG_H, LEG_D), greenMat);
            legR.geometry.translate(0, -LEG_H/2, 0);
            legR.position.set(LEG_W/2, LEG_H, 0);
            legR.castShadow = true;
            player.add(legR);

            scene.add(player);

            // Ник
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(myNick, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.y = LEG_H + TORSO_H + HEAD_H + 0.3;
            sprite.scale.set(2, 0.5, 1);
            player.add(sprite);

            clock = new THREE.Clock();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            setupCameraControls();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let touchId = null;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                joystickActive = true;
                const touch = e.touches[0];
                touchId = touch.identifier;
                updateJoystick(touch, zone);
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!joystickActive) return;
                const touch = Array.from(e.touches).find(t => t.identifier === touchId);
                if (!touch) return;
                updateJoystick(touch, zone);
            }, { passive: false });

            const endTouch = (e) => {
                e.preventDefault();
                e.stopPropagation();
                joystickActive = false;
                touchId = null;
                knob.style.transform = 'translate(0px, 0px)';
                joystickVector.x = 0;
                joystickVector.y = 0;
            };
            zone.addEventListener('touchend', endTouch);
            zone.addEventListener('touchcancel', endTouch);
        }

        function updateJoystick(touch, zone) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);
            
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            document.getElementById('joystick-knob').style.transform = `translate(${kx}px, ${ky}px)`;
            
            joystickVector.x = dx / 45;
            joystickVector.y = dy / 45;

            if (joystickVector.x > 1) joystickVector.x = 1;
            if (joystickVector.x < -1) joystickVector.x = -1;
            if (joystickVector.y > 1) joystickVector.y = 1;
            if (joystickVector.y < -1) joystickVector.y = -1;
        }

        function setupCameraControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn') || e.target.closest('#exit-btn')) return;
                if (cameraTouchId !== null) return;
                const touch = e.changedTouches[0];
                cameraTouchId = touch.identifier;
                cameraTouchStart = { x: touch.clientX, y: touch.clientY };
            });

            document.addEventListener('touchmove', (e) => {
                if (cameraTouchId === null) return;
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (!touch) return;
                
                const dx = touch.clientX - cameraTouchStart.x;
                const dy = touch.clientY - cameraTouchStart.y;
                
                camYaw -= dx * 0.01;
                camPitch += dy * 0.01;
                
                if (camPitch > 1.2) camPitch = 1.2;
                if (camPitch < -0.8) camPitch = -0.8;
                
                cameraTouchStart = { x: touch.clientX, y: touch.clientY };
            });

            document.addEventListener('touchend', (e) => {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (touch) cameraTouchId = null;
            });

            document.addEventListener('touchcancel', (e) => {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (touch) cameraTouchId = null;
            });
        }

        function doJump() {
            if (canJump) {
                velocityY = JUMP_FORCE;
                canJump = false;
            }
        }

        // Проверка коллизий со стенами
        function checkWallCollision(newX, newZ) {
            const r = 0.4;
            for (let wall of WALLS) {
                if (newX + r > wall.x - wall.w/2 &&
                    newX - r < wall.x + wall.w/2 &&
                    newZ + r > wall.z - wall.d/2 &&
                    newZ - r < wall.z + wall.d/2) {
                    return true;
                }
            }
            return false;
        }

        // Проверка, стоит ли персонаж на платформе в данный момент
        function getGroundHeight(x, z) {
            let maxY = 0;
            for (let plat of PLATFORMS) {
                if (x + 0.4 > plat.x - plat.w/2 &&
                    x - 0.4 < plat.x + plat.w/2 &&
                    z + 0.4 > plat.z - plat.d/2 &&
                    z - 0.4 < plat.z + plat.d/2) {
                    const topY = plat.y + plat.h / 2;
                    if (topY > maxY) maxY = topY;
                }
            }
            return maxY;
        }

        // Проверка столкновения с боковой частью платформы
        function checkPlatformSideCollision(newX, newZ, currentY) {
            const r = 0.4;
            for (let plat of PLATFORMS) {
                const topY = plat.y + plat.h / 2;
                const bottomY = plat.y - plat.h / 2;
                if (currentY + 1.5 < topY && currentY > bottomY) {
                    if (newX + r > plat.x - plat.w/2 &&
                        newX - r < plat.x + plat.w/2 &&
                        newZ + r > plat.z - plat.d/2 &&
                        newZ - r < plat.z + plat.d/2) {
                        return true;
                    }
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);

            let inputX = 0, inputZ = 0;
            
            if (joystickActive) {
                let jx = joystickVector.x;
                let jz = -joystickVector.y;
                
                const mag = Math.sqrt(jx*jx + jz*jz);
                if (mag > DEADZONE) {
                    jx = (jx / mag) * Math.min(mag * 2, 1);
                    jz = (jz / mag) * Math.min(mag * 2, 1);
                } else {
                    jx = 0;
                    jz = 0;
                }
                
                inputX = -jx;
                inputZ = jz;
            }

            const forwardX = Math.sin(camYaw);
            const forwardZ = Math.cos(camYaw);
            const rightX = Math.cos(camYaw);
            const rightZ = -Math.sin(camYaw);

            let targetSpeedX = (inputX * rightX + inputZ * forwardX) * MAX_WALK_SPEED;
            let targetSpeedZ = (inputX * rightZ + inputZ * forwardZ) * MAX_WALK_SPEED;

            const accel = canJump ? ACCELERATION : AIR_CONTROL;
            currentSpeedX += (targetSpeedX - currentSpeedX) * accel * delta;
            currentSpeedZ += (targetSpeedZ - currentSpeedZ) * accel * delta;

            if (!joystickActive || (inputX === 0 && inputZ === 0)) {
                currentSpeedX *= (1 - FRICTION * delta);
                currentSpeedZ *= (1 - FRICTION * delta);
            }

            let newX = player.position.x + currentSpeedX * delta;
            if (!checkWallCollision(newX, player.position.z) && 
                !checkPlatformSideCollision(newX, player.position.z, player.position.y)) {
                player.position.x = newX;
            } else {
                currentSpeedX = 0;
            }
            
            let newZ = player.position.z + currentSpeedZ * delta;
            if (!checkWallCollision(player.position.x, newZ) && 
                !checkPlatformSideCollision(player.position.x, newZ, player.position.y)) {
                player.position.z = newZ;
            } else {
                currentSpeedZ = 0;
            }

            const speedMag = Math.sqrt(currentSpeedX*currentSpeedX + currentSpeedZ*currentSpeedZ);
            if (speedMag > 0.5) {
                const targetAngle = Math.atan2(currentSpeedX, currentSpeedZ);
                const currentAngle = player.rotation.y;
                let angleDiff = targetAngle - currentAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                player.rotation.y += angleDiff * 15 * delta;
            }

            // R6-АНИМАЦИЯ
            if (canJump && speedMag > 0.5) {
                walkCycle += delta * 12;
                const swing = Math.sin(walkCycle) * 0.7;
                
                armL.rotation.x = swing;
                armR.rotation.x = -swing;
                legL.rotation.x = -swing;
                legR.rotation.x = swing;
            } else if (!canJump) {
                armL.rotation.x = -2.5;
                armR.rotation.x = -2.5;
                legL.rotation.x = 0.4;
                legR.rotation.x = -0.4;
            } else {
                armL.rotation.x *= 0.7;
                armR.rotation.x *= 0.7;
                legL.rotation.x *= 0.7;
                legR.rotation.x *= 0.7;
            }

            // Гравитация
            velocityY += GRAVITY * delta;
            player.position.y += velocityY * delta;

            // Проверка приземления на платформы
            const groundY = getGroundHeight(player.position.x, player.position.z);
            if (player.position.y <= groundY && velocityY <= 0) {
                player.position.y = groundY;
                velocityY = 0;
                canJump = true;
            }

            // Проверка, не упал ли игрок в пропасть
            if (player.position.y < -20) {
                // Возврат на старт
                player.position.set(0, 0.5, 0);
                velocityY = 0;
                currentSpeedX = 0;
                currentSpeedZ = 0;
            }

            // Границы мира
            if (player.position.x > 48) player.position.x = 48;
            if (player.position.x < -48) player.position.x = -48;
            if (player.position.z > 48) player.position.z = 48;
            if (player.position.z < -48) player.position.z = -48;

            // Камера
            const camDist = 8;
            const camHeight = 3;
            
            let idealCamX = player.position.x - Math.sin(camYaw) * camDist * Math.cos(camPitch);
            let idealCamZ = player.position.z - Math.cos(camYaw) * camDist * Math.cos(camPitch);
            let idealCamY = player.position.y + camHeight + Math.sin(camPitch) * camDist;

            // Проверка, чтобы камера не проходила сквозь стены
            let camDistActual = camDist;
            const steps = 10;
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const testX = player.position.x + (idealCamX - player.position.x) * t;
                const testZ = player.position.z + (idealCamZ - player.position.z) * t;
                const testY = player.position.y + 1.2 + (idealCamY - (player.position.y + 1.2)) * t;
                
                let hit = false;
                for (let wall of WALLS) {
                    if (testX + 0.2 > wall.x - wall.w/2 &&
                        testX - 0.2 < wall.x + wall.w/2 &&
                        testZ + 0.2 > wall.z - wall.d/2 &&
                        testZ - 0.2 < wall.z + wall.d/2 &&
                        testY < wall.y + wall.h/2 && testY > wall.y - wall.h/2) {
                        hit = true;
                        break;
                    }
                }
                
                if (hit) {
                    camDistActual = camDist * (i - 1) / steps;
                    break;
                }
            }
            
            const realCamX = player.position.x - Math.sin(camYaw) * camDistActual * Math.cos(camPitch);
            const realCamZ = player.position.z - Math.cos(camYaw) * camDistActual * Math.cos(camPitch);
            const realCamY = player.position.y + camHeight + Math.sin(camPitch) * camDistActual;

            camera.position.lerp(new THREE.Vector3(realCamX, realCamY, realCamZ), 0.2);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

            renderer.render(scene, camera);
        }

        function exitGame() {
            localStorage.setItem('maxxi_pos_x', player.position.x);
            localStorage.setItem('maxxi_pos_z', player.position.z);
            localStorage.setItem('maxxi_cam_yaw', camYaw);
            localStorage.setItem('maxxi_cam_pitch', camPitch);
            window.location.href = 'index.html';
        }

        window.addEventListener('load', () => {
            const savedX = localStorage.getItem('maxxi_pos_x');
            const savedZ = localStorage.getItem('maxxi_pos_z');
            const savedYaw = localStorage.getItem('maxxi_cam_yaw');
            const savedPitch = localStorage.getItem('maxxi_cam_pitch');
            
            if (savedX && savedZ) {
                player.position.x = parseFloat(savedX);
                player.position.z = parseFloat(savedZ);
            }
            if (savedYaw) camYaw = parseFloat(savedYaw);
            if (savedPitch) camPitch = parseFloat(savedPitch);
        });
    </script>
</body>
</html>
