<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Jump 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #exit-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); border: 1px solid #555; color: #fff;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; z-index: 50;
        }
        #exit-btn:active { background: #333; }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
        }
        #joystick-knob {
            width: 55px; height: 55px; background: rgba(255,255,255,0.6);
            border-radius: 50%; position: absolute;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; font-weight: bold; color: #fff; z-index: 50;
        }
        #jump-btn:active { background: rgba(255,255,255,0.4); }

        #nick-label {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="nick-label">Игрок</div>
    <button id="exit-btn" onclick="exitGame()">Выход</button>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" ontouchstart="doJump()" onmousedown="doJump()">ПРЫЖОК</div>

    <div id="game-canvas"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
        document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

        let scene, camera, renderer, player, clock;
        let velocityY = 0;
        let canJump = true;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let cameraAngle = 0;
        let touchStart = { x: 0, y: 0 };
        let isMoving = false;

        const WALLS = [];
        const GRAVITY = -25;
        const JUMP_FORCE = 8;
        const MOVE_SPEED = 8;

        init3D();
        animate();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 15, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Пол
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Стены
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const wallPositions = [
                { x: -5, z: -5 }, { x: 5, z: -5 }, { x: -5, z: 5 }, { x: 5, z: 5 },
                { x: 0, z: -10 }, { x: 0, z: 10 }, { x: -10, z: 0 }, { x: 10, z: 0 },
                { x: -15, z: -15 }, { x: 15, z: -15 }, { x: -15, z: 15 }, { x: 15, z: 15 }
            ];
            wallPositions.forEach(pos => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), wallMat);
                wall.position.set(pos.x, 1.5, pos.z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                WALLS.push({ x: pos.x, z: pos.z, size: 2, height: 3 });
            });

            // --- ПЕРСОНАЖ (R6) ---
            player = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5 });
            const skinMat2 = new THREE.MeshStandardMaterial({ color: 0x2a5a9e });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
            head.position.y = 1.85;
            head.castShadow = true;
            player.add(head);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), skinMat);
            torso.position.y = 1.15;
            torso.castShadow = true;
            player.add(torso);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), skinMat2);
            armL.position.set(-0.5, 1.15, 0);
            armL.castShadow = true;
            player.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.25), skinMat2);
            armR.position.set(0.5, 1.15, 0);
            armR.castShadow = true;
            player.add(armR);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.9, 0.3), skinMat2);
            legL.position.set(-0.2, 0.45, 0);
            legL.castShadow = true;
            player.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.9, 0.3), skinMat2);
            legR.position.set(0.2, 0.45, 0);
            legR.castShadow = true;
            player.add(legR);

            scene.add(player);

            // Ник
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(myNick, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.y = 2.6;
            sprite.scale.set(2, 0.5, 1);
            player.add(sprite);

            clock = new THREE.Clock();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            setupCameraControls();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ДЖОЙСТИК ---
        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let touchId = null;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const touch = e.touches[0];
                touchId = touch.identifier;
                updateJoystick(touch, zone);
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!joystickActive) return;
                const touch = Array.from(e.touches).find(t => t.identifier === touchId);
                if (!touch) return;
                updateJoystick(touch, zone);
            }, { passive: false });

            const endTouch = (e) => {
                e.preventDefault();
                joystickActive = false;
                touchId = null;
                knob.style.transform = 'translate(0px, 0px)';
                joystickVector.x = 0;
                joystickVector.y = 0;
            };
            zone.addEventListener('touchend', endTouch);
            zone.addEventListener('touchcancel', endTouch);
        }

        function updateJoystick(touch, zone) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);
            
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            document.getElementById('joystick-knob').style.transform = `translate(${kx}px, ${ky}px)`;
            
            joystickVector.x = dx / 45;
            joystickVector.y = dy / 45;

            if (joystickVector.x > 1) joystickVector.x = 1;
            if (joystickVector.x < -1) joystickVector.x = -1;
            if (joystickVector.y > 1) joystickVector.y = 1;
            if (joystickVector.y < -1) joystickVector.y = -1;
        }

        // --- КАМЕРА ---
        function setupCameraControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn') || e.target.closest('#exit-btn')) return;
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn') || e.target.closest('#exit-btn')) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchStart.x;
                cameraAngle -= dx * 0.01;
                touchStart = { x: touch.clientX, y: touch.clientY };
            });
        }

        function doJump() {
            if (canJump) {
                velocityY = JUMP_FORCE;
                canJump = false;
            }
        }

        // --- КОЛЛИЗИИ ---
        function checkCollision(newX, newZ) {
            const r = 0.5;
            for (let wall of WALLS) {
                if (newX + r > wall.x - wall.size/2 &&
                    newX - r < wall.x + wall.size/2 &&
                    newZ + r > wall.z - wall.size/2 &&
                    newZ - r < wall.z + wall.size/2) {
                    return true;
                }
            }
            return false;
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);

            let moveX = 0, moveZ = 0;
            
            if (joystickActive) {
                const forward = -joystickVector.y;
                const strafe = joystickVector.x;
                
                moveX = (strafe * Math.cos(cameraAngle) - forward * Math.sin(cameraAngle)) * MOVE_SPEED * delta;
                moveZ = (strafe * Math.sin(cameraAngle) + forward * Math.cos(cameraAngle)) * MOVE_SPEED * delta;
                
                isMoving = Math.abs(forward) > 0.1 || Math.abs(strafe) > 0.1;
            } else {
                isMoving = false;
            }

            // Движение с проверкой коллизий
            let newX = player.position.x + moveX;
            if (!checkCollision(newX, player.position.z)) {
                player.position.x = newX;
            }
            
            let newZ = player.position.z + moveZ;
            if (!checkCollision(player.position.x, newZ)) {
                player.position.z = newZ;
            }

            // Гравитация
            velocityY += GRAVITY * delta;
            player.position.y += velocityY * delta;

            // Приземление
            if (player.position.y <= 0.9) {
                player.position.y = 0.9;
                velocityY = 0;
                canJump = true;
            }

            // Границы мира
            if (player.position.x > 28) player.position.x = 28;
            if (player.position.x < -28) player.position.x = -28;
            if (player.position.z > 28) player.position.z = 28;
            if (player.position.z < -28) player.position.z = -28;

            // Камера
            const camDist = 8;
            const camHeight = 4;
            const targetX = player.position.x + Math.sin(cameraAngle) * camDist;
            const targetZ = player.position.z + Math.cos(cameraAngle) * camDist;
            const targetY = player.position.y + camHeight;
            
            camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.15);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

            renderer.render(scene, camera);
        }

        function exitGame() {
            localStorage.setItem('maxxi_pos_x', player.position.x);
            localStorage.setItem('maxxi_pos_z', player.position.z);
            localStorage.setItem('maxxi_angle', cameraAngle);
            window.location.href = 'index.html';
        }

        window.addEventListener('load', () => {
            const savedX = localStorage.getItem('maxxi_pos_x');
            const savedZ = localStorage.getItem('maxxi_pos_z');
            const savedAngle = localStorage.getItem('maxxi_angle');
            
            if (savedX && savedZ) {
                player.position.x = parseFloat(savedX);
                player.position.z = parseFloat(savedZ);
            }
            if (savedAngle) {
                cameraAngle = parseFloat(savedAngle);
            }
        });
    </script>
</body>
</html>
