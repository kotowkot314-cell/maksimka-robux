<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Pixel Jump 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; touch-action: none; }
#game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

#menu-btn {
position: fixed; top: 15px; right: 15px;
background: rgba(0,0,0,0.7); border: 2px solid #fff; color: #fff;
width: 55px; height: 55px; border-radius: 8px;
font-size: 1.8rem; font-weight: bold;
z-index: 9999; cursor: pointer;
display: flex; justify-content: center; align-items: center;
}

#menu-panel {
position: fixed; top: 80px; right: 15px;
background: rgba(0,0,0,0.95); border: 2px solid #555;
border-radius: 10px; padding: 10px;
width: 220px; z-index: 9998;
display: none;
}
#menu-panel button {
width: 100%; background: #222; color: #fff;
border: 1px solid #555; border-radius: 6px;
padding: 12px; font-size: 0.9rem; font-weight: bold;
cursor: pointer; margin-bottom: 8px;
text-align: left;
}
#menu-panel button:last-child { margin-bottom: 0; }
#menu-panel button.exit { background: #ff2222; border-color: #ff2222; }

#players-panel {
position: fixed; top: 80px; right: 15px;
background: rgba(0,0,0,0.95); border: 2px solid #555;
border-radius: 10px; padding: 15px;
width: 260px; z-index: 9998;
display: none;
}
#players-panel h3 {
color: #fff; font-size: 1rem; margin-bottom: 10px;
border-bottom: 1px solid #333; padding-bottom: 8px;
}
#players-panel .close-btn {
background: #ff2222; color: #fff; border: none;
padding: 6px 12px; border-radius: 5px; font-size: 0.8rem;
font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%;
}
.player-row {
display: flex; justify-content: space-between; align-items: center;
color: #fff; font-size: 0.9rem; padding: 8px 0;
border-bottom: 1px solid #222;
}
.player-row:last-child { border-bottom: none; }

#joystick-zone {
position: fixed; bottom: 30px; left: 30px; width: 130px; height: 130px;
background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
touch-action: none;
}
#joystick-knob {
width: 55px; height: 55px; background: rgba(255,255,255,0.6);
border-radius: 50%; position: absolute;
}
#jump-btn {
position: fixed; bottom: 50px; right: 40px;
width: 90px; height: 90px; background: rgba(255,255,255,0.15);
border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
display: flex; justify-content: center; align-items: center;
font-size: 2rem; font-weight: bold; color: #fff; z-index: 50;
cursor: pointer;
}

#nick-label {
position: fixed; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
}
</style>
</head>
<body>
<div id="nick-label">Игрок</div>

<button id="menu-btn">𖣔</button>

<div id="menu-panel">
<button onclick="showPlayersList()">Игроки онлайн</button>
<button class="exit" onclick="exitGame()">Выход из игры</button>
</div>

<div id="players-panel">
<button class="close-btn" onclick="hidePlayersList()">Закрыть</button>
<h3>Игроки онлайн</h3>
<div id="players-list"></div>
</div>

<div id="joystick-zone">
<div id="joystick-knob"></div>
</div>
<div id="jump-btn">▲</div>

<div id="game-canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="skin.js"></script>
<script src="mehaniks.js"></script>
<script>

const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

let scene, camera, renderer, player, playerSkin, clock;
let gameReady = false;

const WALLS = [];
const PLATFORMS = [];

const wallMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
const platMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
const jumpPadMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
const finishMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

function createPlatform(x, y, z, w, h, d, mat) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, mat || platMat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    PLATFORMS.push({ x: x, y: y, z: z, w: w, h: h, d: d, top: y + h / 2, bottom: y - h / 2 });
}

function createWall(x, y, z, w, h, d) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, wallMat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    WALLS.push({ x: x, y: y, z: z, w: w, h: h, d: d, top: y + h / 2, bottom: y - h / 2 });
}

initScene();
initMap();
initPlayer();
setupControls();
setupMechanics();
animate();

function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 25, 70);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('game-canvas').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
    sun.position.set(6, 12, 8);
    sun.castShadow = true;
    scene.add(sun);

    const floorGeo = new THREE.PlaneGeometry(200, 200);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x7cbf5a });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    clock = new THREE.Clock();
    window.addEventListener('resize', onWindowResize);
}

function initMap() {
    createPlatform(0, 0.25, 0, 6, 0.5, 6);
    createPlatform(3, 0.5, 1, 1.5, 0.4, 1.5);
    createPlatform(5.5, 1.0, 2.5, 1.5, 0.4, 1.5);
    createPlatform(8, 1.5, 1, 1.5, 0.4, 1.5);
    createPlatform(10.5, 2.0, -1, 1.5, 0.4, 1.5);
    createPlatform(13, 2.5, -3, 1.5, 0.4, 1.5);
    createPlatform(15.5, 2.8, -5, 5, 0.3, 0.6);
    createPlatform(18, 2.8, -8, 2, 0.4, 2);
    createPlatform(19, 3.3, -10, 1.5, 0.4, 1.5);
    createPlatform(19, 3.8, -12, 1.5, 0.4, 1.5);
    createPlatform(19, 4.3, -14, 1.5, 0.4, 1.5);
    createPlatform(19, 4.8, -17, 4, 0.4, 4, finishMat);
    createWall(-6, 1.5, -10, 1, 3, 6);
    createWall(6, 1.5, -10, 1, 3, 6);
    createWall(-6, 1.5, 10, 1, 3, 6);
    createWall(6, 1.5, 10, 1, 3, 6);
    createPlatform(-8, 1, 5, 2, 0.4, 2, jumpPadMat);
    createPlatform(-12, 2, 5, 2, 0.4, 2, jumpPadMat);
}

function initPlayer() {
    player = new THREE.Group();
    playerSkin = createSkin();
    player.add(playerSkin.group);
    scene.add(player);

    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(myNick, 128, 40);
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.y = SKIN.legH + SKIN.torsoH + 0.4;
    sprite.scale.set(2, 0.5, 1);
    player.add(sprite);

    gameReady = true;
}

function setupControls() {
    const menuBtn = document.getElementById('menu-btn');
    const menuPanel = document.getElementById('menu-panel');
    const playersPanel = document.getElementById('players-panel');

    menuBtn.addEventListener('touchstart', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleMenu();
    }, { passive: false });
    menuBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleMenu();
    });

    window.toggleMenu = function() {
        if (menuPanel.style.display === 'block') {
            menuPanel.style.display = 'none';
            playersPanel.style.display = 'none';
        } else {
            menuPanel.style.display = 'block';
            playersPanel.style.display = 'none';
        }
    };
}

window.showPlayersList = function() {
    document.getElementById('menu-panel').style.display = 'none';
    document.getElementById('players-panel').style.display = 'block';
    renderPlayersList();
};

window.hidePlayersList = function() {
    document.getElementById('players-panel').style.display = 'none';
    document.getElementById('menu-panel').style.display = 'block';
};

function renderPlayersList() {
    const list = document.getElementById('players-list');
    list.innerHTML = '';
    const meRow = document.createElement('div');
    meRow.className = 'player-row';
    meRow.innerHTML = '<span>' + myNick + ' (Вы)</span><span style="color:#888; font-size:0.75rem;">—</span>';
    list.appendChild(meRow);
    const emptyRow = document.createElement('div');
    emptyRow.className = 'player-row';
    emptyRow.innerHTML = '<span style="color:#666; font-size:0.8rem;">Другие игроки не найдены</span>';
    list.appendChild(emptyRow);
}

window.exitGame = function() {
    if (player) {
        localStorage.setItem('maxxi_pos_x', player.position.x);
        localStorage.setItem('maxxi_pos_z', player.position.z);
    }
    const state = getMechanicsState();
    localStorage.setItem('maxxi_cam_yaw', state.camYaw);
    localStorage.setItem('maxxi_cam_pitch', state.camPitch);
    window.location.href = 'index.html';
};

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if (!gameReady) return;

    const delta = Math.min(clock.getDelta(), 0.05);

    updateMechanics(player, playerSkin, WALLS, PLATFORMS, delta);
    updateCamera(camera, player, WALLS);

    renderer.render(scene, camera);
}

window.addEventListener('load', () => {
    const savedX = localStorage.getItem('maxxi_pos_x');
    const savedZ = localStorage.getItem('maxxi_pos_z');
    const savedYaw = localStorage.getItem('maxxi_cam_yaw');
    const savedPitch = localStorage.getItem('maxxi_cam_pitch');
    if (savedX && savedZ && player) {
        player.position.x = parseFloat(savedX);
        player.position.z = parseFloat(savedZ);
    }
    if (savedYaw && savedPitch) {
        setMechanicsState(parseFloat(savedYaw), parseFloat(savedPitch));
    }
});
</script>
</body>
</html>
