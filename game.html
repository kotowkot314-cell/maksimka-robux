<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Jump 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #exit-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); border: 1px solid #555; color: #fff;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; z-index: 50;
        }
        #exit-btn:active { background: #333; }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
        }
        #joystick-knob {
            width: 55px; height: 55px; background: rgba(255,255,255,0.6);
            border-radius: 50%; position: absolute;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; font-weight: bold; color: #fff; z-index: 50;
            cursor: pointer;
        }
        #jump-btn:active { background: rgba(255,255,255,0.4); }

        #nick-label {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="nick-label">Игрок</div>
    <button id="exit-btn" onclick="exitGame()">Выход</button>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" ontouchstart="doJump()" onmousedown="doJump()">▲</div>

    <div id="game-canvas"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
        document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

        let scene, camera, renderer, player, clock;
        let velocityY = 0;
        let canJump = true;
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        
        let camYaw = 0;
        let camPitch = 0;
        
        let cameraTouchId = null;
        let cameraTouchStart = { x: 0, y: 0 };

        const GRAVITY = -30;
        const JUMP_FORCE = 9;
        const MAX_WALK_SPEED = 8;
        const ACCELERATION = 40;
        const AIR_CONTROL = 5;
        const FRICTION = 15;
        const DEADZONE = 0.15;

        let currentSpeedX = 0;
        let currentSpeedZ = 0;

        // R6-части тела (выносим для анимации)
        let armL, armR, legL, legR;
        let walkCycle = 0;

        const WALLS = [];

        init3D();
        animate();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 15, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const wallPositions = [
                { x: 0, z: -15, w: 30, h: 3, d: 2 },
                { x: 0, z: 15, w: 30, h: 3, d: 2 },
                { x: -15, z: 0, w: 2, h: 3, d: 30 },
                { x: 15, z: 0, w: 2, h: 3, d: 30 },
                { x: -5, z: -5, w: 2, h: 3, d: 2 },
                { x: 5, z: -5, w: 2, h: 3, d: 2 },
                { x: -5, z: 5, w: 2, h: 3, d: 2 },
                { x: 5, z: 5, w: 2, h: 3, d: 2 },
                { x: 0, z: 0, w: 4, h: 3, d: 2 },
            ];
            wallPositions.forEach(pos => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(pos.w, pos.h, pos.d), wallMat);
                wall.position.set(pos.x, pos.h/2, pos.z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
                WALLS.push({ x: pos.x, z: pos.z, w: pos.w, d: pos.d, h: pos.h });
            });

            // --- ПЕРСОНАЖ R6 ---
            // Классические цвета Roblox R6:
            // Голова — жёлтая (0xffff00 или ближе к 0xffe000)
            // Торс — синий (0x0000ff или 0x0f5cff)
            // Руки — жёлтые (как голова)
            // Ноги — зелёные (0x00ff00 или 0x00aa00)
            
            player = new THREE.Group();
            
            const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffe000 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0f5cff });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x00aa00 });

            // Голова (R6 — куб)
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), yellowMat);
            head.position.y = 1.9;
            head.castShadow = true;
            player.add(head);

            // Туловище (R6 — куб)
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.4), blueMat);
            torso.position.y = 1.2;
            torso.castShadow = true;
            player.add(torso);

            // Левая рука (R6 — цельный блок)
            // Точка вращения — вверху (плечо)
            armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), yellowMat);
            armL.geometry.translate(0, -0.4, 0); // Сдвигаем центр вниз
            armL.position.set(-0.525, 1.6, 0);   // Плечо
            armL.castShadow = true;
            player.add(armL);

            // Правая рука
            armR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), yellowMat);
            armR.geometry.translate(0, -0.4, 0);
            armR.position.set(0.525, 1.6, 0);
            armR.castShadow = true;
            player.add(armR);

            // Левая нога (R6 — цельный блок)
            legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), greenMat);
            legL.geometry.translate(0, -0.4, 0);
            legL.position.set(-0.22, 0.8, 0);   // Бедро
            legL.castShadow = true;
            player.add(legL);

            // Правая нога
            legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), greenMat);
            legR.geometry.translate(0, -0.4, 0);
            legR.position.set(0.22, 0.8, 0);
            legR.castShadow = true;
            player.add(legR);

            scene.add(player);

            // Ник над игроком
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(myNick, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.y = 2.7;
            sprite.scale.set(2, 0.5, 1);
            player.add(sprite);

            clock = new THREE.Clock();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            setupCameraControls();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let touchId = null;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                joystickActive = true;
                const touch = e.touches[0];
                touchId = touch.identifier;
                updateJoystick(touch, zone);
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (!joystickActive) return;
                const touch = Array.from(e.touches).find(t => t.identifier === touchId);
                if (!touch) return;
                updateJoystick(touch, zone);
            }, { passive: false });

            const endTouch = (e) => {
                e.preventDefault();
                e.stopPropagation();
                joystickActive = false;
                touchId = null;
                knob.style.transform = 'translate(0px, 0px)';
                joystickVector.x = 0;
                joystickVector.y = 0;
            };
            zone.addEventListener('touchend', endTouch);
            zone.addEventListener('touchcancel', endTouch);
        }

        function updateJoystick(touch, zone) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);
            
            const kx = Math.cos(angle) * dist;
            const ky = Math.sin(angle) * dist;
            document.getElementById('joystick-knob').style.transform = `translate(${kx}px, ${ky}px)`;
            
            joystickVector.x = dx / 45;
            joystickVector.y = dy / 45;

            if (joystickVector.x > 1) joystickVector.x = 1;
            if (joystickVector.x < -1) joystickVector.x = -1;
            if (joystickVector.y > 1) joystickVector.y = 1;
            if (joystickVector.y < -1) joystickVector.y = -1;
        }

        function setupCameraControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn') || e.target.closest('#exit-btn')) return;
                if (cameraTouchId !== null) return;
                const touch = e.changedTouches[0];
                cameraTouchId = touch.identifier;
                cameraTouchStart = { x: touch.clientX, y: touch.clientY };
            });

            document.addEventListener('touchmove', (e) => {
                if (cameraTouchId === null) return;
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (!touch) return;
                
                const dx = touch.clientX - cameraTouchStart.x;
                const dy = touch.clientY - cameraTouchStart.y;
                
                camYaw -= dx * 0.01;
                camPitch += dy * 0.01;
                
                if (camPitch > 1.2) camPitch = 1.2;
                if (camPitch < -0.8) camPitch = -0.8;
                
                cameraTouchStart = { x: touch.clientX, y: touch.clientY };
            });

            document.addEventListener('touchend', (e) => {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (touch) cameraTouchId = null;
            });

            document.addEventListener('touchcancel', (e) => {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
                if (touch) cameraTouchId = null;
            });
        }

        function doJump() {
            if (canJump) {
                velocityY = JUMP_FORCE;
                canJump = false;
            }
        }

        function checkCollision(newX, newZ) {
            const r = 0.5;
            for (let wall of WALLS) {
                if (newX + r > wall.x - wall.w/2 &&
                    newX - r < wall.x + wall.w/2 &&
                    newZ + r > wall.z - wall.d/2 &&
                    newZ - r < wall.z + wall.d/2) {
                    return true;
                }
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05);

            let inputX = 0, inputZ = 0;
            
            if (joystickActive) {
                let jx = joystickVector.x;
                let jz = -joystickVector.y;
                
                const mag = Math.sqrt(jx*jx + jz*jz);
                if (mag > DEADZONE) {
                    jx = (jx / mag) * Math.min(mag * 2, 1);
                    jz = (jz / mag) * Math.min(mag * 2, 1);
                } else {
                    jx = 0;
                    jz = 0;
                }
                
                inputX = -jx;
                inputZ = jz;
            }

            const forwardX = Math.sin(camYaw);
            const forwardZ = Math.cos(camYaw);
            const rightX = Math.cos(camYaw);
            const rightZ = -Math.sin(camYaw);

            let targetSpeedX = (inputX * rightX + inputZ * forwardX) * MAX_WALK_SPEED;
            let targetSpeedZ = (inputX * rightZ + inputZ * forwardZ) * MAX_WALK_SPEED;

            const accel = canJump ? ACCELERATION : AIR_CONTROL;
            currentSpeedX += (targetSpeedX - currentSpeedX) * accel * delta;
            currentSpeedZ += (targetSpeedZ - currentSpeedZ) * accel * delta;

            if (!joystickActive || (inputX === 0 && inputZ === 0)) {
                currentSpeedX *= (1 - FRICTION * delta);
                currentSpeedZ *= (1 - FRICTION * delta);
            }

            let newX = player.position.x + currentSpeedX * delta;
            if (!checkCollision(newX, player.position.z)) {
                player.position.x = newX;
            } else {
                currentSpeedX = 0;
            }
            
            let newZ = player.position.z + currentSpeedZ * delta;
            if (!checkCollision(player.position.x, newZ)) {
                player.position.z = newZ;
            } else {
                currentSpeedZ = 0;
            }

            // Поворот персонажа
            const speedMag = Math.sqrt(currentSpeedX*currentSpeedX + currentSpeedZ*currentSpeedZ);
            if (speedMag > 0.5) {
                const targetAngle = Math.atan2(currentSpeedX, currentSpeedZ);
                const currentAngle = player.rotation.y;
                let angleDiff = targetAngle - currentAngle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                player.rotation.y += angleDiff * 15 * delta;
            }

            // --- ЖЁСТКАЯ R6-АНИМАЦИЯ ---
            if (canJump && speedMag > 0.5) {
                // Идём по земле: руки/ноги качаются целиком, как маятники
                walkCycle += delta * 12;
                const swing = Math.sin(walkCycle) * 0.7;
                
                // R6: руки и ноги двигаются целыми блоками, в противофазе
                armL.rotation.x = swing;
                armR.rotation.x = -swing;
                legL.rotation.x = -swing;
                legR.rotation.x = swing;
            } else if (!canJump) {
                // В воздухе: R6-поза прыжка
                armL.rotation.x = -2.5;  // Руки вверх (жёстко)
                armR.rotation.x = -2.5;
                legL.rotation.x = 0.4;    // Ноги слегка в стороны
                legR.rotation.x = -0.4;
            } else {
                // Стоим: резкий возврат в исходное положение
                armL.rotation.x *= 0.7;
                armR.rotation.x *= 0.7;
                legL.rotation.x *= 0.7;
                legR.rotation.x *= 0.7;
            }

            // Гравитация
            velocityY += GRAVITY * delta;
            player.position.y += velocityY * delta;

            if (player.position.y <= 0.9) {
                player.position.y = 0.9;
                velocityY = 0;
                canJump = true;
            }

            if (player.position.x > 38) player.position.x = 38;
            if (player.position.x < -38) player.position.x = -38;
            if (player.position.z > 38) player.position.z = 38;
            if (player.position.z < -38) player.position.z = -38;

            const camDist = 8;
            const camHeight = 3;
            
            let idealCamX = player.position.x - Math.sin(camYaw) * camDist * Math.cos(camPitch);
            let idealCamZ = player.position.z - Math.cos(camYaw) * camDist * Math.cos(camPitch);
            let idealCamY = player.position.y + camHeight + Math.sin(camPitch) * camDist;

            let camDistActual = camDist;
            const steps = 10;
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const testX = player.position.x + (idealCamX - player.position.x) * t;
                const testZ = player.position.z + (idealCamZ - player.position.z) * t;
                const testY = player.position.y + 1.2 + (idealCamY - (player.position.y + 1.2)) * t;
                
                let hit = false;
                for (let wall of WALLS) {
                    if (testX + 0.2 > wall.x - wall.w/2 &&
                        testX - 0.2 < wall.x + wall.w/2 &&
                        testZ + 0.2 > wall.z - wall.d/2 &&
                        testZ - 0.2 < wall.z + wall.d/2 &&
                        testY < wall.h) {
                        hit = true;
                        break;
                    }
                }
                
                if (hit) {
                    camDistActual = camDist * (i - 1) / steps;
                    break;
                }
            }
            
            const realCamX = player.position.x - Math.sin(camYaw) * camDistActual * Math.cos(camPitch);
            const realCamZ = player.position.z - Math.cos(camYaw) * camDistActual * Math.cos(camPitch);
            const realCamY = player.position.y + camHeight + Math.sin(camPitch) * camDistActual;

            camera.position.lerp(new THREE.Vector3(realCamX, realCamY, realCamZ), 0.2);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

            renderer.render(scene, camera);
        }

        function exitGame() {
            localStorage.setItem('maxxi_pos_x', player.position.x);
            localStorage.setItem('maxxi_pos_z', player.position.z);
            localStorage.setItem('maxxi_cam_yaw', camYaw);
            localStorage.setItem('maxxi_cam_pitch', camPitch);
            window.location.href = 'index.html';
        }

        window.addEventListener('load', () => {
            const savedX = localStorage.getItem('maxxi_pos_x');
            const savedZ = localStorage.getItem('maxxi_pos_z');
            const savedYaw = localStorage.getItem('maxxi_cam_yaw');
            const savedPitch = localStorage.getItem('maxxi_cam_pitch');
            
            if (savedX && savedZ) {
                player.position.x = parseFloat(savedX);
                player.position.z = parseFloat(savedZ);
            }
            if (savedYaw) camYaw = parseFloat(savedYaw);
            if (savedPitch) camPitch = parseFloat(savedPitch);
        });
    </script>
</body>
</html>
