<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Jump 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #exit-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.7); border: 1px solid #555; color: #fff;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; z-index: 50;
        }
        #exit-btn:active { background: #333; }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
        }
        #joystick-knob {
            width: 55px; height: 55px; background: rgba(255,255,255,0.6);
            border-radius: 50%; position: absolute;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 40px;
            width: 90px; height: 90px; background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.1rem; font-weight: bold; color: #fff; z-index: 50;
        }
        #jump-btn:active { background: rgba(255,255,255,0.4); }

        #nick-label {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="nick-label">Игрок</div>
    <button id="exit-btn" onclick="window.location.href='index.html'">Выход</button>
    
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn" ontouchstart="doJump()" onmousedown="doJump()">ПРЫЖОК</div>

    <div id="game-canvas"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Получаем ник из главного меню
        const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
        document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

        let scene, camera, renderer, player, clock;
        let velocity = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };
        let cameraAngle = 0;
        let touchStart = { x: 0, y: 0 };
        let playerNickSprite;

        init3D();
        animate();

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-canvas').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Пол
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.DoubleSide });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Стены (кубы)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            for (let i = 0; i < 8; i++) {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), wallMat);
                wall.position.set(Math.random() * 20 - 10, 1.5, Math.random() * 20 - 10);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            }

            // Персонаж
            player = new THREE.Group();
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const limbMat = new THREE.MeshStandardMaterial({ color: 0x0088cc });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), bodyMat);
            torso.position.y = 1.2;
            torso.castShadow = true;
            player.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
            head.position.y = 1.8;
            head.castShadow = true;
            player.add(head);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), limbMat);
            armL.position.set(-0.45, 1.2, 0);
            armL.castShadow = true;
            player.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), limbMat);
            armR.position.set(0.45, 1.2, 0);
            armR.castShadow = true;
            player.add(armR);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), limbMat);
            legL.position.set(-0.2, 0.4, 0);
            legL.castShadow = true;
            player.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), limbMat);
            legR.position.set(0.2, 0.4, 0);
            legR.castShadow = true;
            player.add(legR);

            scene.add(player);

            // Ник над игроком
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, 256, 64);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(myNick, 128, 40);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            playerNickSprite = new THREE.Sprite(spriteMat);
            playerNickSprite.position.y = 2.5;
            playerNickSprite.scale.set(2, 0.5, 1);
            player.add(playerNickSprite);

            clock = new THREE.Clock();

            window.addEventListener('resize', onWindowResize);
            setupJoystick();
            setupCameraControls();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setupJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const rect = zone.getBoundingClientRect();
                const touch = e.touches[0];
                joystickStart = { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!joystickActive) return;
                const rect = zone.getBoundingClientRect();
                const touch = e.touches[0];
                const dx = touch.clientX - rect.left - joystickStart.x;
                const dy = touch.clientY - rect.top - joystickStart.y;
                
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
                const angle = Math.atan2(dy, dx);
                
                const kx = Math.cos(angle) * dist;
                const ky = Math.sin(angle) * dist;
                knob.style.transform = `translate(${kx}px, ${ky}px)`;
                
                joystickVector.x = dx / 40;
                joystickVector.y = dy / 40;
            }, { passive: false });

            const endTouch = (e) => {
                e.preventDefault();
                joystickActive = false;
                knob.style.transform = 'translate(0px, 0px)';
                joystickVector.x = 0;
                joystickVector.y = 0;
            };
            zone.addEventListener('touchend', endTouch);
            zone.addEventListener('touchcancel', endTouch);
        }

        function setupCameraControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn')) return;
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            });

            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#joystick-zone') || e.target.closest('#jump-btn')) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchStart.x;
                cameraAngle -= dx * 0.005;
                touchStart = { x: touch.clientX, y: touch.clientY };
            });
        }

        function doJump() {
            if (canJump) {
                velocity.y = 5;
                canJump = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const speed = 20.0 * delta;

            let dirX = 0, dirZ = 0;
            
            if (joystickActive) {
                dirZ = -joystickVector.y * speed;
                dirX = joystickVector.x * speed;
            }

            const moveX = dirX * Math.cos(cameraAngle) - dirZ * Math.sin(cameraAngle);
            const moveZ = dirX * Math.sin(cameraAngle) + dirZ * Math.cos(cameraAngle);

            player.position.x += moveX;
            player.position.z += moveZ;

            velocity.y -= 9.8 * delta;
            player.position.y += velocity.y * delta;

            if (player.position.y < 0.8) {
                velocity.y = 0;
                player.position.y = 0.8;
                canJump = true;
            }

            if (player.position.x > 24) player.position.x = 24;
            if (player.position.x < -24) player.position.x = -24;
            if (player.position.z > 24) player.position.z = 24;
            if (player.position.z < -24) player.position.z = -24;

            const camDist = 10;
            const camHeight = 5;
            camera.position.x = player.position.x + Math.sin(cameraAngle) * camDist;
            camera.position.z = player.position.z + Math.cos(cameraAngle) * camDist;
            camera.position.y = player.position.y + camHeight;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
