<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Pixel Jump 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
body { background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; touch-action: none; }
#game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

#menu-btn {
position: fixed; top: 15px; right: 15px;
background: rgba(0,0,0,0.7); border: 2px solid #fff; color: #fff;
width: 55px; height: 55px; border-radius: 8px;
font-size: 1.8rem; font-weight: bold;
z-index: 9999; cursor: pointer;
display: flex; justify-content: center; align-items: center;
}

#menu-panel {
position: fixed; top: 80px; right: 15px;
background: rgba(0,0,0,0.95); border: 2px solid #555;
border-radius: 10px; padding: 10px;
width: 220px; z-index: 9998;
display: none;
}
#menu-panel button {
width: 100%; background: #222; color: #fff;
border: 1px solid #555; border-radius: 6px;
padding: 12px; font-size: 0.9rem; font-weight: bold;
cursor: pointer; margin-bottom: 8px;
text-align: left;
}
#menu-panel button:last-child { margin-bottom: 0; }
#menu-panel button.exit { background: #ff2222; border-color: #ff2222; }

#players-panel {
position: fixed; top: 80px; right: 15px;
background: rgba(0,0,0,0.95); border: 2px solid #555;
border-radius: 10px; padding: 15px;
width: 260px; z-index: 9998;
display: none;
}
#players-panel h3 {
color: #fff; font-size: 1rem; margin-bottom: 10px;
border-bottom: 1px solid #333; padding-bottom: 8px;
}
#players-panel .close-btn {
background: #ff2222; color: #fff; border: none;
padding: 6px 12px; border-radius: 5px; font-size: 0.8rem;
font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%;
}
.player-row {
display: flex; justify-content: space-between; align-items: center;
color: #fff; font-size: 0.9rem; padding: 8px 0;
border-bottom: 1px solid #222;
}
.player-row:last-child { border-bottom: none; }

#joystick-zone {
position: fixed; bottom: 30px; left: 30px; width: 130px; height: 130px;
background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 50;
touch-action: none;
}
#joystick-knob {
width: 55px; height: 55px; background: rgba(255,255,255,0.6);
border-radius: 50%; position: absolute;
}
#jump-btn {
position: fixed; bottom: 50px; right: 40px;
width: 90px; height: 90px; background: rgba(255,255,255,0.15);
border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
display: flex; justify-content: center; align-items: center;
font-size: 2rem; font-weight: bold; color: #fff; z-index: 50;
cursor: pointer;
}

#nick-label {
position: fixed; top: 15px; left: 15px; color: #fff; font-size: 0.9rem; z-index: 50;
background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 5px;
}
</style>
</head>
<body>
<div id="nick-label">Игрок</div>

<button id="menu-btn">𖣔</button>

<div id="menu-panel">
<button onclick="showPlayersList()">Игроки онлайн</button>
<button class="exit" onclick="exitGame()">Выход из игры</button>
</div>

<div id="players-panel">
<button class="close-btn" onclick="hidePlayersList()">Закрыть</button>
<h3>Игроки онлайн</h3>
<div id="players-list"></div>
</div>

<div id="joystick-zone">
<div id="joystick-knob"></div>
</div>
<div id="jump-btn">▲</div>

<div id="game-canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const myNick = localStorage.getItem('maxxi_nick') || 'Гость';
document.getElementById('nick-label').innerText = 'Вы: ' + myNick;

let scene, camera, renderer, player, clock;
let velocityY = 0;
let canJump = true;
let joystickActive = false;
let joystickVector = { x: 0, y: 0 };

let camYaw = 0;
let camPitch = 0;
let camDist = 8;
const CAM_HEIGHT = 3;

let cameraTouchId = null;
let cameraTouchStart = { x: 0, y: 0 };

let pinchActive = false;
let pinchStartDist = 0;
let pinchStartCamDist = 8;

const GRAVITY = -30;
const JUMP_FORCE = 9;
const MAX_WALK_SPEED = 8;
const ACCELERATION = 40;
const AIR_CONTROL = 5;
const FRICTION = 15;
const DEADZONE = 0.15;

let currentSpeedX = 0;
let currentSpeedZ = 0;

let armL, armR, legL, legR;
let walkCycle = 0;

const WALLS = [];
const PLATFORMS = [];

const TORSO_W = 0.8;
const TORSO_H = 0.9;
const TORSO_D = 0.45;
const ARM_W = TORSO_W / 2;
const ARM_H = 1.0;
const ARM_D = TORSO_W / 2;
const LEG_W = TORSO_W / 2;
const LEG_H = TORSO_H + 0.1;
const LEG_D = TORSO_D;
const PLAYER_RADIUS = 0.4;
const PLAYER_HEIGHT = 2.0;

let gameReady = false;
let isClimbing = false;

const menuBtn = document.getElementById('menu-btn');
const menuPanel = document.getElementById('menu-panel');
const playersPanel = document.getElementById('players-panel');
const joystickZone = document.getElementById('joystick-zone');
const jumpBtn = document.getElementById('jump-btn');

menuBtn.addEventListener('touchstart', function(e) {
e.preventDefault();
e.stopPropagation();
toggleMenu();
}, { passive: false });
menuBtn.addEventListener('click', function(e) {
e.preventDefault();
e.stopPropagation();
toggleMenu();
});

jumpBtn.addEventListener('touchstart', function(e) {
e.preventDefault();
e.stopPropagation();
doJump();
}, { passive: false });
jumpBtn.addEventListener('mousedown', function(e) {
e.preventDefault();
e.stopPropagation();
doJump();
});

function isInsideJoystick(touch) {
const rect = joystickZone.getBoundingClientRect();
return (touch.clientX >= rect.left && touch.clientX <= rect.right &&
touch.clientY >= rect.top && touch.clientY <= rect.bottom);
}

function isInsideJumpBtn(touch) {
const rect = jumpBtn.getBoundingClientRect();
return (touch.clientX >= rect.left && touch.clientX <= rect.right &&
touch.clientY >= rect.top && touch.clientY <= rect.bottom);
}

function isInsideUI(touch) {
if (isInsideJoystick(touch)) return true;
if (isInsideJumpBtn(touch)) return true;
if (touch.target && touch.target.closest && touch.target.closest('#menu-btn')) return true;
if (touch.target && touch.target.closest && touch.target.closest('#menu-panel')) return true;
if (touch.target && touch.target.closest && touch.target.closest('#players-panel')) return true;
return false;
}

function toggleMenu() {
if (menuPanel.style.display === 'block') {
menuPanel.style.display = 'none';
playersPanel.style.display = 'none';
} else {
menuPanel.style.display = 'block';
playersPanel.style.display = 'none';
}
}

function showPlayersList() {
menuPanel.style.display = 'none';
playersPanel.style.display = 'block';
renderPlayersList();
}

function hidePlayersList() {
playersPanel.style.display = 'none';
menuPanel.style.display = 'block';
}

function renderPlayersList() {
const list = document.getElementById('players-list');
list.innerHTML = '';
const meRow = document.createElement('div');
meRow.className = 'player-row';
meRow.innerHTML = '<span>' + myNick + ' (Вы)</span><span style="color:#888; font-size:0.75rem;">—</span>';
list.appendChild(meRow);
const emptyRow = document.createElement('div');
emptyRow.className = 'player-row';
emptyRow.innerHTML = '<span style="color:#666; font-size:0.8rem;">Другие игроки не найдены</span>';
list.appendChild(emptyRow);
}

function exitGame() {
if (player) {
localStorage.setItem('maxxi_pos_x', player.position.x);
localStorage.setItem('maxxi_pos_z', player.position.z);
}
localStorage.setItem('maxxi_cam_yaw', camYaw);
localStorage.setItem('maxxi_cam_pitch', camPitch);
window.location.href = 'index.html';
}

init3D();
animate();

function init3D() {
scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 25, 70);

camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 10);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('game-canvas').appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
sun.position.set(6, 12, 8);
sun.castShadow = true;
scene.add(sun);

const floorGeo = new THREE.PlaneGeometry(200, 200);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x7cbf5a, side: THREE.DoubleSide });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
const platMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa });
const jumpPadMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
const finishMat = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

function createPlatform(x, y, z, w, h, d, mat) {
const geo = new THREE.BoxGeometry(w, h, d);
const mesh = new THREE.Mesh(geo, mat || platMat);
mesh.position.set(x, y, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
scene.add(mesh);
PLATFORMS.push({ x: x, y: y, z: z, w: w, h: h, d: d, top: y + h / 2, bottom: y - h / 2 });
}

function createWall(x, y, z, w, h, d) {
const geo = new THREE.BoxGeometry(w, h, d);
const mesh = new THREE.Mesh(geo, wallMat);
mesh.position.set(x, y, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
scene.add(mesh);
WALLS.push({ x: x, y: y, z: z, w: w, h: h, d: d, top: y + h / 2, bottom: y - h / 2 });
}

createPlatform(0, 0.25, 0, 6, 0.5, 6);
createPlatform(3, 0.5, 1, 1.5, 0.4, 1.5);
createPlatform(5.5, 1.0, 2.5, 1.5, 0.4, 1.5);
createPlatform(8, 1.5, 1, 1.5, 0.4, 1.5);
createPlatform(10.5, 2.0, -1, 1.5, 0.4, 1.5);
createPlatform(13, 2.5, -3, 1.5, 0.4, 1.5);
createPlatform(15.5, 2.8, -5, 5, 0.3, 0.6);
createPlatform(18, 2.8, -8, 2, 0.4, 2);
createPlatform(19, 3.3, -10, 1.5, 0.4, 1.5);
createPlatform(19, 3.8, -12, 1.5, 0.4, 1.5);
createPlatform(19, 4.3, -14, 1.5, 0.4, 1.5);
createPlatform(19, 4.8, -17, 4, 0.4, 4, finishMat);
createWall(-6, 1.5, -10, 1, 3, 6);
createWall(6, 1.5, -10, 1, 3, 6);
createWall(-6, 1.5, 10, 1, 3, 6);
createWall(6, 1.5, 10, 1, 3, 6);
createPlatform(-8, 1, 5, 2, 0.4, 2, jumpPadMat);
createPlatform(-12, 2, 5, 2, 0.4, 2, jumpPadMat);

player = new THREE.Group();

const torsoMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
const limbMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });

const torsoGeo = new THREE.BoxGeometry(TORSO_W, TORSO_H, TORSO_D);
const torso = new THREE.Mesh(torsoGeo, torsoMat);
torso.position.y = LEG_H + TORSO_H / 2;
torso.castShadow = true;
player.add(torso);

function createArm(side) {
const g = new THREE.Group();
g.position.set(side * (TORSO_W / 2 + ARM_W / 2), LEG_H + TORSO_H, 0);
const arm = new THREE.Mesh(new THREE.BoxGeometry(ARM_W, ARM_H, ARM_D), limbMat);
arm.geometry.translate(0, -ARM_H / 2, 0);
arm.castShadow = true;
g.add(arm);
return { g, arm };
}
armL = createArm(-1);
armR = createArm(1);
player.add(armL.g, armR.g);

function createLeg(side) {
const g = new THREE.Group();
g.position.set(side * (LEG_W / 2), LEG_H, 0);
const leg = new THREE.Mesh(new THREE.BoxGeometry(LEG_W, LEG_H, LEG_D), limbMat);
leg.geometry.translate(0, -LEG_H / 2, 0);
leg.castShadow = true;
g.add(leg);
return { g, leg };
}
legL = createLeg(-1);
legR = createLeg(1);
player.add(legL.g, legR.g);

scene.add(player);

const canvas = document.createElement('canvas');
canvas.width = 256; canvas.height = 64;
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, 256, 64);
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 28px Arial';
ctx.textAlign = 'center';
ctx.fillText(myNick, 128, 40);
const texture = new THREE.CanvasTexture(canvas);
const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
const sprite = new THREE.Sprite(spriteMat);
sprite.position.y = LEG_H + TORSO_H + 0.4;
sprite.scale.set(2, 0.5, 1);
player.add(sprite);

clock = new THREE.Clock();
window.addEventListener('resize', onWindowResize);
setupJoystick();
setupCameraControls();
gameReady = true;
}

function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}

let joystickTouchId = null;

function setupJoystick() {
const knob = document.getElementById('joystick-knob');

joystickZone.addEventListener('touchstart', (e) => {
e.preventDefault();
e.stopPropagation();
if (joystickTouchId !== null) return;
const touch = e.changedTouches[0];
joystickTouchId = touch.identifier;
joystickActive = true;
updateJoystick(touch, joystickZone);
}, { passive: false });

joystickZone.addEventListener('touchmove', (e) => {
e.preventDefault();
e.stopPropagation();
if (joystickTouchId === null) return;
const touch = Array.from(e.changedTouches).find(t => t.identifier === joystickTouchId);
if (!touch) return;
updateJoystick(touch, joystickZone);
}, { passive: false });

function endJoystick(e) {
if (joystickTouchId === null) return;
const touch = Array.from(e.changedTouches).find(t => t.identifier === joystickTouchId);
if (!touch) return;
joystickTouchId = null;
joystickActive = false;
knob.style.transform = 'translate(0px, 0px)';
joystickVector.x = 0;
joystickVector.y = 0;
}

joystickZone.addEventListener('touchend', endJoystick);
joystickZone.addEventListener('touchcancel', endJoystick);

document.addEventListener('touchend', function(e) {
if (joystickTouchId === null) return;
const touch = Array.from(e.changedTouches).find(t => t.identifier === joystickTouchId);
if (touch) {
joystickTouchId = null;
joystickActive = false;
knob.style.transform = 'translate(0px, 0px)';
joystickVector.x = 0;
joystickVector.y = 0;
}
});
}

function updateJoystick(touch, zone) {
const rect = zone.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const dx = touch.clientX - centerX;
const dy = touch.clientY - centerY;
const dist = Math.min(Math.sqrt(dx * dx + dy * dy), 45);
const angle = Math.atan2(dy, dx);
const kx = Math.cos(angle) * dist;
const ky = Math.sin(angle) * dist;
document.getElementById('joystick-knob').style.transform = `translate(${kx}px, ${ky}px)`;
joystickVector.x = dx / 45;
joystickVector.y = dy / 45;
if (joystickVector.x > 1) joystickVector.x = 1;
if (joystickVector.x < -1) joystickVector.x = -1;
if (joystickVector.y > 1) joystickVector.y = 1;
if (joystickVector.y < -1) joystickVector.y = -1;
}

function getTouchDist(touches) {
const dx = touches[0].clientX - touches[1].clientX;
const dy = touches[0].clientY - touches[1].clientY;
return Math.sqrt(dx * dx + dy * dy);
}

function setupCameraControls() {
document.addEventListener('touchstart', (e) => {
if (e.touches.length === 2) {
const t1 = e.touches[0];
const t2 = e.touches[1];
if (isInsideUI(t1) || isInsideUI(t2)) return;
pinchActive = true;
cameraTouchId = null;
pinchStartDist = getTouchDist(e.touches);
pinchStartCamDist = camDist;
return;
}

if (e.touches.length === 1 && !pinchActive) {
if (cameraTouchId !== null) return;
const touch = e.touches[0];
if (isInsideUI(touch)) return;
cameraTouchId = touch.identifier;
cameraTouchStart = { x: touch.clientX, y: touch.clientY };
}
}, { passive: false });

document.addEventListener('touchmove', (e) => {
if (e.touches.length === 2 && pinchActive) {
e.preventDefault();
const dist = getTouchDist(e.touches);
if (pinchStartDist > 0) {
const scale = pinchStartDist / dist;
camDist = pinchStartCamDist * scale;
if (camDist < 3) camDist = 3;
if (camDist > 20) camDist = 20;
}
return;
}

if (cameraTouchId !== null && !pinchActive) {
const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
if (!touch) return;
if (isInsideUI(touch)) return;
e.preventDefault();
const dx = touch.clientX - cameraTouchStart.x;
const dy = touch.clientY - cameraTouchStart.y;
camYaw -= dx * 0.01;
camPitch += dy * 0.01;
if (camPitch > 1.2) camPitch = 1.2;
if (camPitch < -0.8) camPitch = -0.8;
cameraTouchStart = { x: touch.clientX, y: touch.clientY };
}
}, { passive: false });

function endCamera(e) {
if (e.touches.length < 2) {
pinchActive = false;
}
if (cameraTouchId === null) return;
const touch = Array.from(e.changedTouches).find(t => t.identifier === cameraTouchId);
if (touch) cameraTouchId = null;
}

document.addEventListener('touchend', endCamera);
document.addEventListener('touchcancel', endCamera);
}

function doJump() {
if (canJump) {
velocityY = JUMP_FORCE;
canJump = false;
isClimbing = false;
}
}

function intersectsHorizontal(px, pz, r, obj) {
return (px + r > obj.x - obj.w / 2 &&
px - r < obj.x + obj.w / 2 &&
pz + r > obj.z - obj.d / 2 &&
pz - r < obj.z + obj.d / 2);
}

function getGroundHeight(px, pz, playerY) {
let maxY = 0;
const headY = playerY + PLAYER_HEIGHT;
for (let plat of PLATFORMS) {
if (intersectsHorizontal(px, pz, PLAYER_RADIUS * 0.8, plat)) {
if (plat.top <= headY + 0.1) {
if (plat.top > maxY) maxY = plat.top;
}
}
}
return maxY;
}

function checkHorizontalCollision(px, pz, playerY, newX, newZ) {
const headY = playerY + PLAYER_HEIGHT;
const feetY = playerY;
for (let wall of WALLS) {
if (headY > wall.bottom && feetY < wall.top) {
if (newX + PLAYER_RADIUS > wall.x - wall.w / 2 &&
newX - PLAYER_RADIUS < wall.x + wall.w / 2 &&
newZ + PLAYER_RADIUS > wall.z - wall.d / 2 &&
newZ - PLAYER_RADIUS < wall.z + wall.d / 2) {
return true;
}
}
}
for (let plat of PLATFORMS) {
if (headY > plat.bottom && feetY < plat.top - 0.1) {
if (newX + PLAYER_RADIUS > plat.x - plat.w / 2 &&
newX - PLAYER_RADIUS < plat.x + plat.w / 2 &&
newZ + PLAYER_RADIUS > plat.z - plat.d / 2 &&
newZ - PLAYER_RADIUS < plat.z + plat.d / 2) {
return true;
}
}
}
return false;
}

function checkClimbing(px, pz, playerY) {
const headY = playerY + PLAYER_HEIGHT;
const feetY = playerY;
const checkRadius = PLAYER_RADIUS + 0.15;
for (let wall of WALLS) {
if (headY > wall.bottom && feetY < wall.top) {
if (px + checkRadius > wall.x - wall.w / 2 &&
px - checkRadius < wall.x + wall.w / 2 &&
pz + checkRadius > wall.z - wall.d / 2 &&
pz - checkRadius < wall.z + wall.d / 2) {
return true;
}
}
}
for (let plat of PLATFORMS) {
if (headY > plat.bottom && feetY < plat.top - 0.1) {
if (px + checkRadius > plat.x - plat.w / 2 &&
px - checkRadius < plat.x + plat.w / 2 &&
pz + checkRadius > plat.z - plat.d / 2 &&
pz - checkRadius < plat.z + plat.d / 2) {
return true;
}
}
}
return false;
}

function animate() {
requestAnimationFrame(animate);
if (!gameReady) return;

const delta = Math.min(clock.getDelta(), 0.05);
let inputX = 0, inputZ = 0;

if (joystickActive) {
let jx = joystickVector.x;
let jz = -joystickVector.y;
const mag = Math.sqrt(jx * jx + jz * jz);
if (mag > DEADZONE) {
jx = (jx / mag) * Math.min(mag * 2, 1);
jz = (jz / mag) * Math.min(mag * 2, 1);
} else {
jx = 0;
jz = 0;
}
inputX = -jx;
inputZ = jz;
}

const forwardX = Math.sin(camYaw);
const forwardZ = Math.cos(camYaw);
const rightX = Math.cos(camYaw);
const rightZ = -Math.sin(camYaw);

let targetSpeedX = (inputX * rightX + inputZ * forwardX) * MAX_WALK_SPEED;
let targetSpeedZ = (inputX * rightZ + inputZ * forwardZ) * MAX_WALK_SPEED;

const accel = canJump ? ACCELERATION : AIR_CONTROL;
currentSpeedX += (targetSpeedX - currentSpeedX) * accel * delta;
currentSpeedZ += (targetSpeedZ - currentSpeedZ) * accel * delta;

if (!joystickActive || (inputX === 0 && inputZ === 0)) {
currentSpeedX *= (1 - FRICTION * delta);
currentSpeedZ *= (1 - FRICTION * delta);
}

const touchingWall = checkClimbing(player.position.x, player.position.z, player.position.y);
if (touchingWall && !canJump && velocityY < 0) {
isClimbing = true;
}
if (isClimbing && !canJump) {
velocityY = 2;
}

let newX = player.position.x + currentSpeedX * delta;
if (!checkHorizontalCollision(player.position.x, player.position.z, player.position.y, newX, player.position.z)) {
player.position.x = newX;
} else {
currentSpeedX = 0;
}

let newZ = player.position.z + currentSpeedZ * delta;
if (!checkHorizontalCollision(player.position.x, player.position.z, player.position.y, player.position.x, newZ)) {
player.position.z = newZ;
} else {
currentSpeedZ = 0;
}

const speedMag = Math.sqrt(currentSpeedX * currentSpeedX + currentSpeedZ * currentSpeedZ);
if (speedMag > 0.5) {
const targetAngle = Math.atan2(currentSpeedX, currentSpeedZ);
const currentAngle = player.rotation.y;
let angleDiff = targetAngle - currentAngle;
while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
player.rotation.y += angleDiff * 15 * delta;
}

if (canJump && speedMag > 0.5) {
walkCycle += delta * 12;
const swing = Math.sin(walkCycle) * 0.7;
armL.g.rotation.x = swing;
armR.g.rotation.x = -swing;
legL.g.rotation.x = -swing;
legR.g.rotation.x = swing;
} else if (!canJump) {
armL.g.rotation.x = -2.5;
armR.g.rotation.x = -2.5;
legL.g.rotation.x = 0.4;
legR.g.rotation.x = -0.4;
} else {
armL.g.rotation.x *= 0.7;
armR.g.rotation.x *= 0.7;
legL.g.rotation.x *= 0.7;
legR.g.rotation.x *= 0.7;
}

velocityY += GRAVITY * delta;
player.position.y += velocityY * delta;

const groundY = getGroundHeight(player.position.x, player.position.z, player.position.y);
if (player.position.y <= groundY && velocityY <= 0) {
player.position.y = groundY;
velocityY = 0;
canJump = true;
isClimbing = false;
}

if (player.position.y < -20) {
player.position.set(0, 2, 0);
velocityY = 0;
currentSpeedX = 0;
currentSpeedZ = 0;
isClimbing = false;
}

if (player.position.x > 48) player.position.x = 48;
if (player.position.x < -48) player.position.x = -48;
if (player.position.z > 48) player.position.z = 48;
if (player.position.z < -48) player.position.z = -48;

let idealCamX = player.position.x - Math.sin(camYaw) * camDist * Math.cos(camPitch);
let idealCamZ = player.position.z - Math.cos(camYaw) * camDist * Math.cos(camPitch);
let idealCamY = player.position.y + CAM_HEIGHT + Math.sin(camPitch) * camDist;

let camDistActual = camDist;
const steps = 10;
for (let i = 1; i <= steps; i++) {
const t = i / steps;
const testX = player.position.x + (idealCamX - player.position.x) * t;
const testZ = player.position.z + (idealCamZ - player.position.z) * t;
const testY = player.position.y + 1.2 + (idealCamY - (player.position.y + 1.2)) * t;
let hit = false;
for (let wall of WALLS) {
if (testX + 0.2 > wall.x - wall.w / 2 &&
testX - 0.2 < wall.x + wall.w / 2 &&
testZ + 0.2 > wall.z - wall.d / 2 &&
testZ - 0.2 < wall.z + wall.d / 2 &&
testY < wall.top && testY > wall.bottom) {
hit = true;
break;
}
}
if (hit) {
camDistActual = camDist * (i - 1) / steps;
break;
}
}

const realCamX = player.position.x - Math.sin(camYaw) * camDistActual * Math.cos(camPitch);
const realCamZ = player.position.z - Math.cos(camYaw) * camDistActual * Math.cos(camPitch);
const realCamY = player.position.y + CAM_HEIGHT + Math.sin(camPitch) * camDistActual;

camera.position.lerp(new THREE.Vector3(realCamX, realCamY, realCamZ), 0.2);
camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);

renderer.render(scene, camera);
}

window.addEventListener('load', () => {
const savedX = localStorage.getItem('maxxi_pos_x');
const savedZ = localStorage.getItem('maxxi_pos_z');
const savedYaw = localStorage.getItem('maxxi_cam_yaw');
const savedPitch = localStorage.getItem('maxxi_cam_pitch');
if (savedX && savedZ && player) {
player.position.x = parseFloat(savedX);
player.position.z = parseFloat(savedZ);
}
if (savedYaw) camYaw = parseFloat(savedYaw);
if (savedPitch) camPitch = parseFloat(savedPitch);
});
</script>
