<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Xliilx — Игра</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; cursor: crosshair; }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
    }
    #hud .logo { color: #e63946; font-weight: bold; letter-spacing: 2px; }
    #logout {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #2a2a2a;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #logout:hover { background: #e63946; }
    #crosshair-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #666;
      font-size: 12px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="logo">XLIILX</div>
    <div id="info">Загрузка...</div>
  </div>
  <button id="logout" onclick="logout()">Выйти</button>
  <div id="crosshair-hint">WASD — движение | Мышь — прицел | ЛКМ — выстрел</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const username = localStorage.getItem('username');
    if (!username) location.href = '/';

    function logout() {
      localStorage.clear();
      location.href = '/';
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resize();
    addEventListener('resize', resize);

    const socket = io();
    let self = null;
    const players = {};
    const bullets = [];
    let mouseX = innerWidth / 2;
    let mouseY = innerHeight / 2;

    socket.on('connect', () => socket.emit('join', { username }));

    socket.on('init', (data) => {
      self = data.selfId;
      Object.assign(players, data.players);
    });

    socket.on('playerJoined', (p) => { players[p.id] = p; });
    socket.on('playerLeft', (id) => { delete players[id]; });
    socket.on('playerMoved', (d) => {
      if (players[d.id]) Object.assign(players[d.id], d);
    });
    socket.on('playerShot', ({ id, angle }) => {
      const p = players[id];
      if (!p) return;
      bullets.push({
        x: p.x + Math.cos(angle) * 20,
        y: p.y + Math.sin(angle) * 20,
        vx: Math.cos(angle) * 14,
        vy: Math.sin(angle) * 14,
        life: 60,
        owner: id
      });
    });

    const keys = {};
    addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    addEventListener('mousedown', () => {
      if (!self || !players[self]) return;
      const me = players[self];
      const angle = Math.atan2(mouseY - me.y, mouseX - me.x);
      bullets.push({
        x: me.x + Math.cos(angle) * 20,
        y: me.y + Math.sin(angle) * 20,
        vx: Math.cos(angle) * 14,
        vy: Math.sin(angle) * 14,
        life: 60,
        owner: self
      });
      socket.emit('shoot', { angle });
    });

    function loop() {
      if (self && players[self]) {
        const me = players[self];
        let dx = 0, dy = 0;
        if (keys['w'] || keys['ц']) dy -= 5;
        if (keys['s'] || keys['ы']) dy += 5;
        if (keys['a'] || keys['ф']) dx -= 5;
        if (keys['d'] || keys['в']) dx += 5;
        if (dx || dy) {
          me.x += dx;
          me.y += dy;
          const angle = Math.atan2(mouseY - me.y, mouseX - me.x);
          me.angle = angle;
          socket.emit('move', { x: me.x, y: me.y, angle });
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // 
      ctx.fillStyle = '#0f0f0f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Сетка
      ctx.strokeStyle = '#1e1e1e';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      //
      for (const id in players) {
        const p = players[id];
        const isSelf = id === self;

        // 
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath();
        ctx.arc(p.x + 2, p.y + 2, 16, 0, Math.PI * 2);
        ctx.fill();

        // 
        ctx.fillStyle = isSelf ? '#4ade80' : '#e63946';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();

        // Оха
        ctx.strokeStyle = isSelf ? '#22c55e' : '#b91c1c';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 
        if (p.angle !== undefined) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + Math.cos(p.angle) * 22, p.y + Math.sin(p.angle) * 22);
          ctx.stroke();
        }

        // 
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.username, p.x, p.y - 26);
      }

      // 
      for (const b of bullets) {
        ctx.fillStyle = '#fbbf24';
        ctx.shadowColor = '#fbbf24';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      document.getElementById('info').textContent =
        `Игрок: ${username} | Онлайн: ${Object.keys(players).length}`;

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
